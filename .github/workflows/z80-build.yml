      - name: Publish WebMSX-ready development disk at a permanent raw URL
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            git fetch origin feature/z80-renderer
            git switch -C preview-publish FETCH_HEAD
            mkdir -p assets
            cp z80/build/KBLZ80TEST.DSK assets/KBLZ80TEST.DSK
          cp z80/build/KBLONEFILE.DSK assets/KBLONEFILE.DSK
          cp z80/build/KBLWIPEINT.DSK assets/KBLWIPEINT.DSK
          cp z80/build/KBLWIPEINT12.DSK assets/KBLWIPEINT12.DSK
          cp z80/build/KBLWIPEINT14.DSK assets/KBLWIPEINT14.DSK
          cp z80/build/KBLWIPELEAN.DSK assets/KBLWIPELEAN.DSK
          cp z80/build/KBLWIBENCH.DSK assets/KBLWIBENCH.DSK
          cp z80/build/KBLWIAUTO.DSK assets/KBLWIAUTO.DSK
          cp z80/build/KBLTITLE.DSK assets/KBLTITLE.DSK
          cp z80/build/KBLTITLECOPY.DSK assets/KBLTITLECOPY.DSK
          cp z80/build/KBLCTEST.DSK assets/KBLCTEST.DSK
          cp z80/build/KBLWIPE.DSK assets/KBLWIPE.DSK
          cp z80/build/KBLWIPE2.DSK assets/KBLWIPE2.DSK
          cp z80/build/KBLWIPE2.DSK assets/KBLWIPE2FIX.DSK
          cp z80/build/KBLWIPE3.DSK assets/KBLWIPE3.DSK
          cp z80/build/KBLWIPE4.DSK assets/KBLWIPE4.DSK
          cp z80/build/KBLWIPE5.DSK assets/KBLWIPE5.DSK
          cp z80/build/KBLWIPE6.DSK assets/KBLWIPE6.DSK
          cp z80/build/KBLWIPE7.DSK assets/KBLWIPE7.DSK
          cp z80/build/KBLWIPE8.DSK assets/KBLWIPE8.DSK
          cp z80/build/KBLWIPE9.DSK assets/KBLWIPE9.DSK
          cp z80/build/KBLWIPE10.DSK assets/KBLWIPE10.DSK
          cp z80/build/KBLWIPE11.DSK assets/KBLWIPE11.DSK
          cp z80/build/KBLWIPE12.DSK assets/KBLWIPE12.DSK
          cp z80/build/KBLWIPE13.DSK assets/KBLWIPE13.DSK
          cp z80/build/KBLWIPE14.DSK assets/KBLWIPE14.DSK
          cp z80/build/KBLWIPE14FIX.DSK assets/KBLWIPE14FIX.DSK
          cp z80/build/KBLWIPE14FIX2.DSK assets/KBLWIPE14FIX2.DSK
          test "$(stat -c %s assets/KBLONEFILE.DSK)" -eq 737280
            test "$(stat -c %s assets/KBLZ80TEST.DSK)" -eq 737280
            git add -f assets/KBLZ80TEST.DSK assets/KBLONEFILE.DSK assets/KBLWIPE.DSK assets/KBLWIPE2.DSK assets/KBLWIPE2FIX.DSK assets/KBLWIPE3.DSK assets/KBLWIPE4.DSK assets/KBLWIPE5.DSK assets/KBLWIPE6.DSK assets/KBLWIPE7.DSK assets/KBLWIPE8.DSK assets/KBLWIPE9.DSK assets/KBLWIPE10.DSK assets/KBLWIPE11.DSK assets/KBLWIPE12.DSK assets/KBLWIPE13.DSK assets/KBLWIPE14.DSK assets/KBLWIPE14FIX.DSK assets/KBLWIPE14FIX2.DSK assets/KBLWIPEINT.DSK assets/KBLWIPEINT12.DSK assets/KBLWIPEINT14.DSK assets/KBLCTEST.DSK assets/KBLWIPELEAN.DSK assets/KBLWIBENCH.DSK assets/KBLWIAUTO.DSK assets/KBLTITLE.DSK assets/KBLTITLECOPY.DSK
            if git diff --cached --quiet; then
              echo "Preview disk unchanged; no commit required."
              break
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(z80): publish experimental WebMSX preview disk [skip ci]"
            if git push origin HEAD:feature/z80-renderer; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::Could not publish preview after five optimistic retries."
              exit 1
            fi
            sleep 2
          done
          echo "### WebMSX previews: full working alpha and unverified single-BLOAD prototype" >> "$GITHUB_STEP_SUMMARY"
          echo "https://webmsx.org/?MACHINE=MSX2E&RAMMAPPER_SIZE=256&AUTO_START=true&FAST_BOOT=1&DISK=https://raw.githubusercontent.com/Ritbit/MSX-Kabelkrant/feature/z80-renderer/assets/KBLZ80TEST.DSK" >> "$GITHUB_STEP_SUMMARY"
          echo "UNVERIFIED ONEFILE: https://webmsx.org/?MACHINE=MSX2E&RAMMAPPER_SIZE=256&AUTO_START=true&FAST_BOOT=1&DISK=https://raw.githubusercontent.com/Ritbit/MSX-Kabelkrant/feature/z80-renderer/assets/KBLONEFILE.DSK" >> "$GITHUB_STEP_SUMMARY"

      - name: Create combined RAMdisk + Z80 TEXT experimental test disk
