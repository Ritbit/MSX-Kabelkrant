name: Z80 build and emulator smoke tests
on:
  push:
    branches: [feature/z80-renderer]
    paths: ['.github/workflows/z80-build.yml', 'z80/**', 'src/X.DAT']
  workflow_dispatch:

concurrency:
  group: z80-preview-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build SjASMPlus 1.24.0
        run: |
          git clone --recursive --depth 1 --branch v1.24.0 https://github.com/z00m128/sjasmplus.git /tmp/sjasmplus
          cmake -S /tmp/sjasmplus -B /tmp/sjasmplus-build -DCMAKE_BUILD_TYPE=Release -DENABLE_LUA=OFF -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/sjasmplus-build --parallel 2
          sudo cmake --install /tmp/sjasmplus-build
          sjasmplus --version
      - name: Convert and verify original fonts
        run: python3 z80/tools/convert_fonts.py --xdat src/X.DAT --output z80/build/FONTS.DAT
      - name: Run font conversion tests
        run: python3 -m unittest discover -s z80/tests -p 'test_conversion.py' -v
      - name: Audit ASCII 33-127 font coverage
        run: python3 -m unittest discover -s z80/tests -p 'test_charset.py' -v
      - name: Assemble Z80 prototype
        run: |
          (cd z80/asm && sjasmplus --raw=../build/kernel.raw --lst=../build/kernel.lst --sym=../build/kernel.sym kernel.asm)
          test -s z80/build/kernel.raw
      - name: Assemble isolated V9938 wipe #1 prototype (not connected to broadcast)
        run: |
          python3 -m unittest discover -s z80/tests -p 'test_wipe_kernel.py' -v
          (cd z80/asm && sjasmplus --raw=../build/wipe1.raw --lst=../build/wipe1.lst wipe_forward.asm)
          test -s z80/build/wipe1.raw
          python3 z80/tools/make_bload.py z80/build/wipe1.raw z80/build/WIPE1.BIN
          test -s z80/build/WIPE1.BIN
          (cd z80/asm && sjasmplus --raw=../build/wipe2.raw --lst=../build/wipe2.lst wipe_reverse.asm)
          python3 z80/tools/make_bload.py z80/build/wipe2.raw z80/build/WIPE2.BIN
          test -s z80/build/WIPE2.BIN
          python3 -m unittest discover -s z80/tests -p 'test_wipe_binary.py' -v
          (cd z80/asm && sjasmplus --raw=../build/wipe3.raw --lst=../build/wipe3.lst wipe_lr.asm)
          python3 z80/tools/make_bload.py z80/build/wipe3.raw z80/build/WIPE3.BIN
          (cd z80/asm && sjasmplus --raw=../build/wipe4.raw --lst=../build/wipe4.lst wipe_rl.asm)
          python3 z80/tools/make_bload.py z80/build/wipe4.raw z80/build/WIPE4.BIN
          (cd z80/asm && sjasmplus --raw=../build/wipe5.raw --lst=../build/wipe5.lst wipe_tb_centre.asm)
          python3 z80/tools/make_bload.py z80/build/wipe5.raw z80/build/WIPE5.BIN
          (cd z80/asm && sjasmplus --raw=../build/wipe6.raw --lst=../build/wipe6.lst wipe_lr_centre.asm)
          python3 z80/tools/make_bload.py z80/build/wipe6.raw z80/build/WIPE6.BIN
          (cd z80/asm && sjasmplus --raw=../build/wipe7.raw --lst=../build/wipe7.lst wipe_tb_outward.asm)
          python3 z80/tools/make_bload.py z80/build/wipe7.raw z80/build/WIPE7.BIN
          (cd z80/asm && sjasmplus --raw=../build/wipe8.raw --lst=../build/wipe8.lst wipe_lr_outward.asm)
          python3 z80/tools/make_bload.py z80/build/wipe8.raw z80/build/WIPE8.BIN
          (cd z80/asm && sjasmplus --raw=../build/wipe9.raw --lst=../build/wipe9.lst wipe_box_in.asm)
          python3 z80/tools/make_bload.py z80/build/wipe9.raw z80/build/WIPE9.BIN
          (cd z80/asm && sjasmplus --raw=../build/wipe10.raw --lst=../build/wipe10.lst wipe_box_out.asm)
          python3 z80/tools/make_bload.py z80/build/wipe10.raw z80/build/WIPE10.BIN
          (cd z80/asm && sjasmplus --raw=../build/wipe11.raw --lst=../build/wipe11.lst wipe11.asm)
          python3 z80/tools/make_bload.py z80/build/wipe11.raw z80/build/WIPE11.BIN
          (cd z80/asm && sjasmplus --raw=../build/wipe12.raw --lst=../build/wipe12.lst wipe12.asm)
          python3 z80/tools/make_bload.py z80/build/wipe12.raw z80/build/WIPE12.BIN
          (cd z80/asm && sjasmplus --raw=../build/wipe13.raw --lst=../build/wipe13.lst wipe13.asm)
          python3 z80/tools/make_bload.py z80/build/wipe13.raw z80/build/WIPE13.BIN
          (cd z80/asm && sjasmplus --raw=../build/wipe14.raw --lst=../build/wipe14.lst wipe14.asm)
          python3 z80/tools/make_bload.py z80/build/wipe14.raw z80/build/WIPE14.BIN
      - name: Assemble standalone CALL TEXT demo
        run: |
          (cd z80/asm && sjasmplus --raw=../build/textdemo.raw --lst=../build/textdemo.lst --sym=../build/textdemo.sym basic_text_demo.asm)
          python3 z80/tools/make_bload.py z80/build/textdemo.raw z80/build/KBLTXT.BIN
          python3 -m unittest discover -s z80/tests -p 'test_bload.py' -v
          python3 -m unittest discover -s z80/tests -p 'test_colour_mask.py' -v
      - name: Audit current 4KiB TEXT plus wipe memory budget
        run: python3 z80/tools/audit_wipe_memory.py
      - name: Verify original RAMdisk storage bounds
        run: |
          python3 z80/tools/ramdisk_layout.py
          python3 -m unittest discover -s z80/tests -p 'test_ramdisk_layout.py' -v
          echo "::warning::Combined ROM experimental: RAMdisk zero-fills the TEXT entry at 46F5h."
      - name: Test and assemble combined RAMdisk+TEXT disk ROM
        run: |
          python3 -m unittest discover -s z80/tests -p 'test_combined_rom.py' -v
          python3 z80/tools/make_combined_rom.py --root . --output z80/build
          (cd z80/asm && sjasmplus --raw=../build/combined_text.raw --lst=../build/combined_text.lst --sym=../build/combined_text.sym .generated_combined.asm)
          python3 z80/tools/make_combined_rom.py --root . --output z80/build --extension z80/build/combined_text.raw
          test -s z80/build/KBLALL.BIN
      - name: Validate MSX BASIC ASCII formatting
        run: |
          python3 -m unittest discover -s z80/tests -p 'test_msx_basic_ascii.py' -v
          python3 z80/tools/msx_basic_ascii.py z80/asm/ASMTEXT.BAS z80/build/ASMTEXT.BAS
          python3 z80/tools/msx_basic_ascii.py z80/asm/ASMBOOT.BAS z80/build/AUTOEXEC.BAS
      - name: Generate original BASIC four-font reference
        run: |
          python3 z80/tools/make_font_baseline.py --source src/LOOP.SYS --output z80/build/FONTBAS.BAS
          python3 z80/tools/make_font_baseline.py --source src/LOOP.SYS --output z80/build/FONTCOL.BAS --colour-test
          python3 -m unittest discover -s z80/tests -p 'test_font_baseline.py' -v
      - name: Generate A/B renderer benchmarks
        run: |
          python3 z80/tools/benchmark_basic.py --disk assets/kabelkrant-6.2.dsk --optimized src/LOOP.SYS --output z80/build
      - name: Create isolated MSX2 demo disk
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mtools
          cp assets/kabelkrant-6.2.dsk z80/build/KBLASM.DSK
          # The stand-alone emulator regression does not initialize RAMDISK.BIN.
          # RAMDISK+C004 coexistence is tracked as a separate integration task.
          printf '10 SCREEN 0:WIDTH 80:COLOR 15,4,4\r\n20 PRINT "KABELKRANT Z80 CALL TEXT TEST"\r\n30 RUN "ASMTEXT.BAS"\r\n' > z80/build/AUTOEXEC.BAS
          mcopy -o -i z80/build/KBLASM.DSK z80/build/AUTOEXEC.BAS ::AUTOEXEC.BAS
          mcopy -o -i z80/build/KBLASM.DSK z80/build/ASMTEXT.BAS ::ASMTEXT.BAS
          mcopy -o -i z80/build/KBLASM.DSK z80/build/FONTBAS.BAS ::FONTBAS.BAS
          mcopy -o -i z80/build/KBLASM.DSK z80/build/KBLTXT.BIN ::KBLTXT.BIN
          mdir -i z80/build/KBLASM.DSK ::
          test "$(stat -c %s z80/build/KBLASM.DSK)" -eq 737280
      - name: Build isolated wipe-one demonstration disk
        run: |
          cp assets/kabelkrant-6.2.dsk z80/build/KBLWIPE.DSK
          printf '%s\r\n' \
            '10 CLEAR 1000,&HC7FF:SCREEN 7:COLOR 15,0,0' \
            '20 CLS:LINE(0,50)-(511,211),14,BF' \
            '30 LINE(0,50)-(511,211),1,B' \
            '40 FOR T=1 TO 1000:NEXT T' \
            '50 BLOAD "WIPE1.BIN",R' \
            '60 FOR T=1 TO 1000:NEXT T' \
            '70 GOTO 20' > z80/build/WIPEAUTO.BAS
          mcopy -o -i z80/build/KBLWIPE.DSK z80/build/WIPEAUTO.BAS ::AUTOEXEC.BAS
          mcopy -o -i z80/build/KBLWIPE.DSK z80/build/WIPE1.BIN ::WIPE1.BIN
          test "$(stat -c %s z80/build/KBLWIPE.DSK)" -eq 737280
          mdir -i z80/build/KBLWIPE.DSK ::WIPE1.BIN
      - name: Build isolated bottom-up wipe demonstration disk
        run: |
          cp assets/kabelkrant-6.2.dsk z80/build/KBLWIPE2.DSK
          printf '%s\r\n' \
            '10 CLEAR 1000,&HC7FF:SCREEN 7:COLOR 15,0,0' \
            '20 CLS:LINE(0,50)-(511,211),14,BF:LOCATE 0,0:PRINT "WIPE 2: BOTTOM TO TOP"' \
            '30 LINE(0,50)-(511,211),1,B' \
            '40 FOR T=1 TO 1000:NEXT T' \
            '50 BLOAD "WIPE2.BIN",R' \
            '60 FOR T=1 TO 1000:NEXT T' \
            '70 GOTO 20' > z80/build/WIPEAUTO2.BAS
          mcopy -o -i z80/build/KBLWIPE2.DSK z80/build/WIPEAUTO2.BAS ::AUTOEXEC.BAS
          mcopy -o -i z80/build/KBLWIPE2.DSK z80/build/WIPE2.BIN ::WIPE2.BIN
          test "$(stat -c %s z80/build/KBLWIPE2.DSK)" -eq 737280
          cmp <(mcopy -i z80/build/KBLWIPE2.DSK ::WIPE2.BIN -) z80/build/WIPE2.BIN
          if mdir -b -i z80/build/KBLWIPE2.DSK ::WIPE1.BIN >/dev/null 2>&1; then
            echo "::error::Wipe2 demo unexpectedly contains wipe1 binary"
            exit 1
          fi
      - name: Build horizontal wipe #3 and #4 standalone disks
        run: |
          set -euo pipefail
          for num in 3 4; do
            cp assets/kabelkrant-6.2.dsk "z80/build/KBLWIPE${num}.DSK"
            if [[ "$num" -eq 3 ]]; then
              description="LEFT TO RIGHT"
            else
              description="RIGHT TO LEFT"
            fi
            printf '%s\r\n' \
              '10 CLEAR 1000,&HC7FF:SCREEN 7:COLOR 15,0,0' \
              "20 CLS:LINE(0,50)-(511,211),14,BF:LOCATE 0,0:PRINT \"WIPE ${num}: ${description}\"" \
              '30 LINE(0,50)-(511,211),1,B' \
              '40 FOR T=1 TO 1000:NEXT T' \
              "50 BLOAD \"WIPE${num}.BIN\",R" \
              '60 FOR T=1 TO 1000:NEXT T' \
              '70 GOTO 20' > "z80/build/WIPEAUTO${num}.BAS"
            mcopy -o -i "z80/build/KBLWIPE${num}.DSK" "z80/build/WIPEAUTO${num}.BAS" ::AUTOEXEC.BAS
            mcopy -o -i "z80/build/KBLWIPE${num}.DSK" "z80/build/WIPE${num}.BIN" "::WIPE${num}.BIN"
            test "$(stat -c %s "z80/build/KBLWIPE${num}.DSK")" -eq 737280
          done
          python3 -m unittest discover -s z80/tests -p 'test_horizontal_wipes.py' -v
      - name: Build and test inward wipe #5/#6 standalone disks
        run: |
          set -euo pipefail
          for num in 5 6; do
            cp assets/kabelkrant-6.2.dsk "z80/build/KBLWIPE${num}.DSK"
            if [[ "$num" -eq 5 ]]; then
              description="TOP BOTTOM TO CENTRE"
            else
              description="LEFT RIGHT TO CENTRE"
            fi
            printf '%s\r\n' \
              '10 CLEAR 1000,&HC7FF:SCREEN 7:COLOR 15,0,0' \
              "20 CLS:LINE(0,50)-(511,211),14,BF:LOCATE 0,0:PRINT \"WIPE ${num}: ${description}\"" \
              '30 LINE(0,50)-(511,211),1,B' \
              '40 FOR T=1 TO 1000:NEXT T' \
              "50 BLOAD \"WIPE${num}.BIN\",R" \
              '60 FOR T=1 TO 1000:NEXT T' \
              '70 GOTO 20' > "z80/build/WIPEAUTO${num}.BAS"
            mcopy -o -i "z80/build/KBLWIPE${num}.DSK" "z80/build/WIPEAUTO${num}.BAS" ::AUTOEXEC.BAS
            mcopy -o -i "z80/build/KBLWIPE${num}.DSK" "z80/build/WIPE${num}.BIN" "::WIPE${num}.BIN"
            test "$(stat -c %s "z80/build/KBLWIPE${num}.DSK")" -eq 737280
          done
          python3 -m unittest discover -s z80/tests -p 'test_centre_wipes.py' -v
      - name: Build and verify centre-outward wipe #7/#8 disks
        run: |
          set -euo pipefail
          for num in 7 8; do
            cp assets/kabelkrant-6.2.dsk "z80/build/KBLWIPE${num}.DSK"
            if [[ "$num" -eq 7 ]]; then
              description="CENTRE TO TOP BOTTOM"
            else
              description="CENTRE TO LEFT RIGHT"
            fi
            printf '%s\r\n' \
              '10 CLEAR 1000,&HC7FF:SCREEN 7:COLOR 15,0,0' \
              "20 CLS:LINE(0,50)-(511,211),14,BF:LOCATE 0,0:PRINT \"WIPE ${num}: ${description}\"" \
              '30 LINE(0,50)-(511,211),1,B' \
              '40 FOR T=1 TO 1000:NEXT T' \
              "50 BLOAD \"WIPE${num}.BIN\",R" \
              '60 FOR T=1 TO 1000:NEXT T' \
              '70 GOTO 20' > "z80/build/WIPEAUTO${num}.BAS"
            mcopy -o -i "z80/build/KBLWIPE${num}.DSK" "z80/build/WIPEAUTO${num}.BAS" ::AUTOEXEC.BAS
            mcopy -o -i "z80/build/KBLWIPE${num}.DSK" "z80/build/WIPE${num}.BIN" "::WIPE${num}.BIN"
            test "$(stat -c %s "z80/build/KBLWIPE${num}.DSK")" -eq 737280
          done
          python3 -m unittest discover -s z80/tests -p 'test_outward_wipes.py' -v
      - name: Build and verify rectangular-outline wipe #9/#10 disks
        run: |
          set -euo pipefail
          for num in 9 10; do
            cp assets/kabelkrant-6.2.dsk "z80/build/KBLWIPE${num}.DSK"
            if [[ "$num" -eq 9 ]]; then
              description="OUTSIDE TO CENTRE"
            else
              description="CENTRE TO OUTSIDE"
            fi
            printf '%s\r\n' \
              '10 CLEAR 1000,&HC7FF:SCREEN 7:COLOR 15,0,0' \
              "20 CLS:LINE(0,50)-(511,211),14,BF:LOCATE 0,0:PRINT \"WIPE ${num}: ${description}\"" \
              '30 LINE(0,50)-(511,211),1,B' \
              '40 FOR T=1 TO 1000:NEXT T' \
              "50 BLOAD \"WIPE${num}.BIN\",R" \
              '60 FOR T=1 TO 1000:NEXT T' \
              '70 GOTO 20' > "z80/build/WIPEAUTO${num}.BAS"
            mcopy -o -i "z80/build/KBLWIPE${num}.DSK" "z80/build/WIPEAUTO${num}.BAS" ::AUTOEXEC.BAS
            mcopy -o -i "z80/build/KBLWIPE${num}.DSK" "z80/build/WIPE${num}.BIN" "::WIPE${num}.BIN"
            test "$(stat -c %s "z80/build/KBLWIPE${num}.DSK")" -eq 737280
          done
          python3 -m unittest discover -s z80/tests -p 'test_box_wipes.py' -v
      - name: Build and verify interlaced wipe #11/#12 disks
        run: |
          set -euo pipefail
          for num in 11 12; do
            cp assets/kabelkrant-6.2.dsk "z80/build/KBLWIPE${num}.DSK"
            if [[ "$num" -eq 11 ]]; then
              description="TOP BOTTOM INTERLACED"
            else
              description="LEFT RIGHT INTERLACED"
            fi
            printf '%s\r\n' \
              '10 CLEAR 1000,&HC7FF:SCREEN 7:COLOR 15,0,0' \
              "20 CLS:LINE(0,50)-(511,211),14,BF:LOCATE 0,0:PRINT \"WIPE ${num}: ${description}\"" \
              '30 LINE(0,50)-(511,211),1,B' \
              '40 FOR T=1 TO 1000:NEXT T' \
              "50 BLOAD \"WIPE${num}.BIN\",R" \
              '60 FOR T=1 TO 1000:NEXT T' \
              '70 GOTO 20' > "z80/build/WIPEAUTO${num}.BAS"
            mcopy -o -i "z80/build/KBLWIPE${num}.DSK" "z80/build/WIPEAUTO${num}.BAS" ::AUTOEXEC.BAS
            mcopy -o -i "z80/build/KBLWIPE${num}.DSK" "z80/build/WIPE${num}.BIN" "::WIPE${num}.BIN"
            test "$(stat -c %s "z80/build/KBLWIPE${num}.DSK")" -eq 737280
          done
          python3 -m unittest discover -s z80/tests -p 'test_interlaced_wipes.py' -v
      - name: Build and verify final wipe #13/#14 disks
        run: |
          set -euo pipefail
          for num in 13 14; do
            cp assets/kabelkrant-6.2.dsk "z80/build/KBLWIPE${num}.DSK"
            if [[ "$num" -eq 13 ]]; then
              description="FOUR COLUMN INTERLACE"
            else
              description="FOUR RECTANGLES"
            fi
            printf '%s\r\n' \
              '10 CLEAR 1000,&HC7FF:SCREEN 7:COLOR 15,0,0' \
              "20 CLS:LINE(0,50)-(511,211),14,BF:LOCATE 0,0:PRINT \"WIPE ${num}: ${description}\"" \
              '30 LINE(0,50)-(511,211),1,B' \
              '40 FOR T=1 TO 1000:NEXT T' \
              "50 BLOAD \"WIPE${num}.BIN\",R" \
              '60 FOR T=1 TO 1000:NEXT T' \
              '70 GOTO 20' > "z80/build/WIPEAUTO${num}.BAS"
            mcopy -o -i "z80/build/KBLWIPE${num}.DSK" "z80/build/WIPEAUTO${num}.BAS" ::AUTOEXEC.BAS
            mcopy -o -i "z80/build/KBLWIPE${num}.DSK" "z80/build/WIPE${num}.BIN" "::WIPE${num}.BIN"
            test "$(stat -c %s "z80/build/KBLWIPE${num}.DSK")" -eq 737280
          done
          python3 -m unittest discover -s z80/tests -p 'test_last_wipes.py' -v
          # Cache-safe fixed preview, byte-identical to the CI-verified wipe14 image.
          cp z80/build/KBLWIPE14.DSK z80/build/KBLWIPE14FIX.DSK
          cmp z80/build/KBLWIPE14.DSK z80/build/KBLWIPE14FIX.DSK
          cmp <(mcopy -i z80/build/KBLWIPE14FIX.DSK ::WIPE14.BIN -) z80/build/WIPE14.BIN
          cp z80/build/KBLWIPE14.DSK z80/build/KBLWIPE14FIX2.DSK
          cmp z80/build/KBLWIPE14.DSK z80/build/KBLWIPE14FIX2.DSK
          cmp <(mcopy -i z80/build/KBLWIPE14FIX2.DSK ::WIPE14.BIN -) z80/build/WIPE14.BIN
      - name: Upload final individual wipe demos (experimental)
        uses: actions/upload-artifact@v4
        with:
          name: KBLWIPE13-14-EXPERIMENTAL
          path: |
            z80/build/KBLWIPE13.DSK
            z80/build/KBLWIPE14.DSK
            z80/build/KBLWIPE14FIX.DSK
            z80/build/KBLWIPE14FIX2.DSK
          if-no-files-found: error
      - name: Upload interlaced wipe demos (experimental)
        uses: actions/upload-artifact@v4
        with:
          name: KBLWIPE11-12-INTERLACED-EXPERIMENTAL
          path: |
            z80/build/KBLWIPE11.DSK
            z80/build/KBLWIPE12.DSK
          if-no-files-found: error
      - name: Upload rectangular-outline wipe demos (experimental)
        uses: actions/upload-artifact@v4
        with:
          name: KBLWIPE9-10-RECTANGULAR-OUTLINES
          path: |
            z80/build/KBLWIPE9.DSK
            z80/build/KBLWIPE10.DSK
          if-no-files-found: error
      - name: Upload isolated centre-outward wipe disks (experimental)
        uses: actions/upload-artifact@v4
        with:
          name: KBLWIPE7-8-OUTWARD-EXPERIMENTAL
          path: |
            z80/build/KBLWIPE7.DSK
            z80/build/KBLWIPE8.DSK
          if-no-files-found: error
      - name: Upload isolated inward wipe disks (experimental)
        uses: actions/upload-artifact@v4
        with:
          name: KBLWIPE5-6-TOWARD-CENTRE-EXPERIMENTAL
          path: |
            z80/build/KBLWIPE5.DSK
            z80/build/KBLWIPE6.DSK
          if-no-files-found: error
      - name: Upload isolated horizontal wipe disks (experimental)
        uses: actions/upload-artifact@v4
        with:
          name: KBLWIPE3-4-HORIZONTAL-EXPERIMENTAL
          path: |
            z80/build/KBLWIPE3.DSK
            z80/build/KBLWIPE4.DSK
          if-no-files-found: error
      - name: Upload isolated bottom-up wipe demonstration disk
        uses: actions/upload-artifact@v4
        with:
          name: KBLWIPE2-V9938-BOTTOMUP-UNVERIFIED
          path: z80/build/KBLWIPE2.DSK
          if-no-files-found: error
      - name: Upload isolated wipe demo (needs visual validation)
        uses: actions/upload-artifact@v4
        with:
          name: KBLWIPE-V9938-TOPDOWN-UNVERIFIED
          path: z80/build/KBLWIPE.DSK
          if-no-files-found: error
      - name: Generate full Kabelkrant Z80 test BASIC files
        run: |
          python3 z80/tools/make_full_z80_test.py --root . --output z80/build/full
          python3 -m unittest discover -s z80/tests -p 'test_full_z80_test.py' -v
      - name: Checkout published 6.2b disk as read-only integration baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: z80/build/stable
          persist-credentials: false
      - name: Build full Kabelkrant Z80 preview image (NOT A RELEASE)
        run: |
          cp z80/build/stable/assets/kabelkrant-6.2b.dsk z80/build/KBLZ80TEST.DSK
          mcopy -i z80/build/KBLZ80TEST.DSK ::LOOP.SYS z80/build/full/LOOPBAS.SYS
          mcopy -o -i z80/build/KBLZ80TEST.DSK z80/build/full/LOOPBAS.SYS ::LOOPBAS.SYS
          mcopy -o -i z80/build/KBLZ80TEST.DSK z80/build/full/KBLINIT.SYS ::KBLINIT.SYS
          mcopy -o -i z80/build/KBLZ80TEST.DSK z80/build/full/LOOP.SYS ::LOOP.SYS
          mcopy -o -i z80/build/KBLZ80TEST.DSK z80/build/KBLTXT.BIN ::KBLTXT.BIN
          mdir -i z80/build/KBLZ80TEST.DSK ::KBLTXT.BIN
          test "$(stat -c %s z80/build/KBLZ80TEST.DSK)" -eq 737280
      - name: Validate completed full Z80 disk against released BASIC 6.2b
        run: |
          python3 -m unittest discover -s z80/tests -p 'test_full_disk_image.py' -v
      - name: Test composite loader and construct single-BLOAD prototype
        run: |
          python3 -m unittest discover -s z80/tests -p 'test_onefile_preview.py' -v
          cmp src/RAMDISK.BIN z80/build/stable/src/RAMDISK.BIN
          python3 z80/tools/make_onefile_preview.py --ramdisk src/RAMDISK.BIN --text z80/build/KBLTXT.BIN --output z80/build/KBLRAMTX.BIN
          python3 z80/tools/make_full_z80_test.py --root . --output z80/build/onefile --one-file
      - name: 'Build isolated one-BLOAD disk (UNPROVEN: mapper persistence)'
        run: |
          cp z80/build/stable/assets/kabelkrant-6.2b.dsk z80/build/KBLONEFILE.DSK
          mcopy -i z80/build/KBLONEFILE.DSK ::LOOP.SYS z80/build/onefile/LOOPBAS.SYS
          mcopy -o -i z80/build/KBLONEFILE.DSK z80/build/onefile/LOOPBAS.SYS ::LOOPBAS.SYS
          mcopy -o -i z80/build/KBLONEFILE.DSK z80/build/onefile/KBLINIT.SYS ::KBLINIT.SYS
          mcopy -o -i z80/build/KBLONEFILE.DSK z80/build/onefile/LOOP.SYS ::LOOP.SYS
          mcopy -o -i z80/build/KBLONEFILE.DSK z80/build/KBLRAMTX.BIN ::RAMDISK.BIN
          test "$(stat -c %s z80/build/KBLONEFILE.DSK)" -eq 737280
          test "$(mcopy -i z80/build/KBLONEFILE.DSK ::RAMDISK.BIN - | wc -c)" -eq "$(stat -c %s z80/build/KBLRAMTX.BIN)"
          mdir -i z80/build/KBLONEFILE.DSK ::RAMDISK.BIN
      - name: Verify published one-BLOAD disk structure and unchanged files
        run: python3 -m unittest discover -s z80/tests -p 'test_onefile_disk_image.py' -v
      - name: Upload single-BLOAD experimental disk (NOT RUNTIME VERIFIED)
        uses: actions/upload-artifact@v4
        with:
          name: KBLONEFILE-UNVERIFIED-RAMDISK-TEXT-STAGING
          path: |
            z80/build/KBLONEFILE.DSK
            z80/build/KBLRAMTX.BIN
          if-no-files-found: error
      - name: Upload full Kabelkrant Z80 preview disk (runtime testing required)
        uses: actions/upload-artifact@v4
        with:
          name: KBLZ80TEST-full-Kabelkrant-EXPERIMENTAL
          path: z80/build/KBLZ80TEST.DSK
          if-no-files-found: error
      - name: Publish WebMSX-ready development disk at a permanent raw URL
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            git fetch origin feature/z80-renderer
            git switch -C preview-publish FETCH_HEAD
            mkdir -p assets
            cp z80/build/KBLZ80TEST.DSK assets/KBLZ80TEST.DSK
          cp z80/build/KBLONEFILE.DSK assets/KBLONEFILE.DSK
          cp z80/build/KBLWIPE.DSK assets/KBLWIPE.DSK
          cp z80/build/KBLWIPE2.DSK assets/KBLWIPE2.DSK
          cp z80/build/KBLWIPE2.DSK assets/KBLWIPE2FIX.DSK
          cp z80/build/KBLWIPE3.DSK assets/KBLWIPE3.DSK
          cp z80/build/KBLWIPE4.DSK assets/KBLWIPE4.DSK
          cp z80/build/KBLWIPE5.DSK assets/KBLWIPE5.DSK
          cp z80/build/KBLWIPE6.DSK assets/KBLWIPE6.DSK
          cp z80/build/KBLWIPE7.DSK assets/KBLWIPE7.DSK
          cp z80/build/KBLWIPE8.DSK assets/KBLWIPE8.DSK
          cp z80/build/KBLWIPE9.DSK assets/KBLWIPE9.DSK
          cp z80/build/KBLWIPE10.DSK assets/KBLWIPE10.DSK
          cp z80/build/KBLWIPE11.DSK assets/KBLWIPE11.DSK
          cp z80/build/KBLWIPE12.DSK assets/KBLWIPE12.DSK
          cp z80/build/KBLWIPE13.DSK assets/KBLWIPE13.DSK
          cp z80/build/KBLWIPE14.DSK assets/KBLWIPE14.DSK
          cp z80/build/KBLWIPE14FIX.DSK assets/KBLWIPE14FIX.DSK
          cp z80/build/KBLWIPE14FIX2.DSK assets/KBLWIPE14FIX2.DSK
          test "$(stat -c %s assets/KBLONEFILE.DSK)" -eq 737280
            test "$(stat -c %s assets/KBLZ80TEST.DSK)" -eq 737280
            git add -f assets/KBLZ80TEST.DSK assets/KBLONEFILE.DSK assets/KBLWIPE.DSK assets/KBLWIPE2.DSK assets/KBLWIPE2FIX.DSK assets/KBLWIPE3.DSK assets/KBLWIPE4.DSK assets/KBLWIPE5.DSK assets/KBLWIPE6.DSK assets/KBLWIPE7.DSK assets/KBLWIPE8.DSK assets/KBLWIPE9.DSK assets/KBLWIPE10.DSK assets/KBLWIPE11.DSK assets/KBLWIPE12.DSK assets/KBLWIPE13.DSK assets/KBLWIPE14.DSK assets/KBLWIPE14FIX.DSK assets/KBLWIPE14FIX2.DSK
            if git diff --cached --quiet; then
              echo "Preview disk unchanged; no commit required."
              break
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(z80): publish experimental WebMSX preview disk [skip ci]"
            if git push origin HEAD:feature/z80-renderer; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::Could not publish preview after five optimistic retries."
              exit 1
            fi
            sleep 2
          done
          echo "### WebMSX previews: full working alpha and unverified single-BLOAD prototype" >> "$GITHUB_STEP_SUMMARY"
          echo "https://webmsx.org/?MACHINE=MSX2E&RAMMAPPER_SIZE=256&AUTO_START=true&FAST_BOOT=1&DISK=https://raw.githubusercontent.com/Ritbit/MSX-Kabelkrant/feature/z80-renderer/assets/KBLZ80TEST.DSK" >> "$GITHUB_STEP_SUMMARY"
          echo "UNVERIFIED ONEFILE: https://webmsx.org/?MACHINE=MSX2E&RAMMAPPER_SIZE=256&AUTO_START=true&FAST_BOOT=1&DISK=https://raw.githubusercontent.com/Ritbit/MSX-Kabelkrant/feature/z80-renderer/assets/KBLONEFILE.DSK" >> "$GITHUB_STEP_SUMMARY"

      - name: Create combined RAMdisk + Z80 TEXT experimental test disk
        run: |
          cp assets/kabelkrant-6.2.dsk z80/build/KBLCOMB.DSK
          mcopy -o -i z80/build/KBLCOMB.DSK z80/build/COMBAUTO.BAS ::AUTOEXEC.BAS
          mcopy -o -i z80/build/KBLCOMB.DSK z80/build/COMBTEXT.BAS ::COMBTEXT.BAS
          mcopy -o -i z80/build/KBLCOMB.DSK z80/build/KBLALL.BIN ::KBLALL.BIN
          mdir -i z80/build/KBLCOMB.DSK ::
          test "$(stat -c %s z80/build/KBLCOMB.DSK)" -eq 737280
      - name: Upload experimental combined RAMdisk and text image
        uses: actions/upload-artifact@v4
        with:
          name: KBLCOMB-KNOWN-UNSAFE-DO-NOT-RELEASE
          path: |
            z80/build/KBLCOMB.DSK
            z80/build/KBLALL.BIN
            z80/build/combined_text.lst
          if-no-files-found: error
      - name: Create original BASIC-only reference disk
        run: |
          cp assets/kabelkrant-6.2.dsk z80/build/KBLBASE.DSK
          printf '10 RUN "FONTBAS.BAS"\r\n' > z80/build/BASEAUTO.BAS
          mcopy -o -i z80/build/KBLBASE.DSK z80/build/BASEAUTO.BAS ::AUTOEXEC.BAS
          mcopy -o -i z80/build/KBLBASE.DSK z80/build/FONTBAS.BAS ::FONTBAS.BAS
          mcopy -o -i z80/build/KBLBASE.DSK z80/build/FONTCOL.BAS ::FONTCOL.BAS
          mdir -i z80/build/KBLBASE.DSK ::FONTBAS.BAS
          test "$(stat -c %s z80/build/KBLBASE.DSK)" -eq 737280
      - name: Create benchmark disk
        run: |
          cp assets/kabelkrant-6.2.dsk z80/build/KBLBENCH.DSK
          printf '10 RUN "BENCH1.BAS"\r\n' > z80/build/BENCHAUTO.BAS
          mcopy -o -i z80/build/KBLBENCH.DSK z80/build/BENCHAUTO.BAS ::AUTOEXEC.BAS
          mcopy -o -i z80/build/KBLBENCH.DSK z80/build/BENCH1.BAS ::BENCH1.BAS
          mcopy -o -i z80/build/KBLBENCH.DSK z80/build/BENCH3.BAS ::BENCH3.BAS
          mdir -i z80/build/KBLBENCH.DSK ::BENCH1.BAS
          mdir -i z80/build/KBLBENCH.DSK ::BENCH3.BAS
          test "$(stat -c %s z80/build/KBLBENCH.DSK)" -eq 737280
      - name: Upload original-versus-optimized BASIC benchmark disk
        uses: actions/upload-artifact@v4
        with:
          name: KBLBENCH-original-vs-optimized-BASIC
          path: z80/build/KBLBENCH.DSK
          if-no-files-found: error
      - name: Upload original BASIC reference disk
        uses: actions/upload-artifact@v4
        with:
          name: KBLBASE-original-BASIC-four-font-testdisk
          path: z80/build/KBLBASE.DSK
          if-no-files-found: error
      - name: Upload isolated demo disk (emulator test required)
        uses: actions/upload-artifact@v4
        with:
          name: KBLASM-experimental-MSX2-testdisk
          path: z80/build/KBLASM.DSK
          if-no-files-found: error
      - name: Upload prototype (NOT bootable)
        uses: actions/upload-artifact@v4
        with:
          name: z80-prototype-NOT-BOOTABLE
          path: |
            z80/build/kernel.raw
            z80/build/kernel.lst
            z80/build/kernel.sym
            z80/build/FONTS.DAT
            z80/build/textdemo.raw
            z80/build/textdemo.lst
            z80/build/textdemo.sym
            z80/build/KBLTXT.BIN
          if-no-files-found: error

  # The build always runs. This emulator job only starts when all four
  # user-provided ROM secrets exist. No BIOS bytes enter the repository or
  # published artifacts. See BUILD-AND-TEST.md for secret setup.
  openmsx-smoke:
    name: openMSX NMS 8250 runtime smoke
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MSX_NMS8250_BIOS_B64: ${{ secrets.MSX_NMS8250_BIOS_B64 }}
      MSX_NMS8250_BASIC_B64: ${{ secrets.MSX_NMS8250_BASIC_B64 }}
      MSX_NMS8250_SUB_B64: ${{ secrets.MSX_NMS8250_SUB_B64 }}
      MSX_NMS8250_DISK_B64: ${{ secrets.MSX_NMS8250_DISK_B64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Download standalone Z80 disk from this run
        uses: actions/download-artifact@v4
        with:
          name: KBLASM-experimental-MSX2-testdisk
          path: z80/build

      - name: Determine whether system ROMs were configured
        shell: bash
        run: |
          if [[ -n "$MSX_NMS8250_BIOS_B64" && -n "$MSX_NMS8250_BASIC_B64" && -n "$MSX_NMS8250_SUB_B64" && -n "$MSX_NMS8250_DISK_B64" ]]; then
            echo "ROM_READY=true" >> "$GITHUB_ENV"
          else
            echo "ROM_READY=false" >> "$GITHUB_ENV"
            echo "::warning::openMSX runtime smoke SKIPPED: four MSX_NMS8250_*_B64 repository secrets are needed."
            echo "### openMSX runtime: SKIPPED (ROM secrets not configured)" >> "$GITHUB_STEP_SUMMARY"
            echo "Build and Python unit tests are not emulator execution." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install headless emulator
        if: env.ROM_READY == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openmsx openmsx-data xvfb python3-pil
          test "$(stat -c %s z80/build/KBLASM.DSK)" -eq 737280

      - name: Decode four NMS 8250 ROMs into ephemeral private directory
        if: env.ROM_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          rom_dir="$RUNNER_TEMP/openmsx-roms"
          mkdir -p "$rom_dir"
          printf '%s' "$MSX_NMS8250_BIOS_B64" | base64 --decode > "$rom_dir/bios.rom"
          printf '%s' "$MSX_NMS8250_BASIC_B64" | base64 --decode > "$rom_dir/basic.rom"
          printf '%s' "$MSX_NMS8250_SUB_B64" | base64 --decode > "$rom_dir/sub.rom"
          printf '%s' "$MSX_NMS8250_DISK_B64" | base64 --decode > "$rom_dir/disk.rom"
          for part in bios basic sub disk; do
            test "$(stat -c %s "$rom_dir/$part.rom")" -eq 16384
          done
          # The NMS 8250 expects a combined 32KiB MSX BIOS+BASIC file.
          cat "$rom_dir/bios.rom" "$rom_dir/basic.rom" > "$rom_dir/nms8250_basic-bios2.rom"
          rom_pool="$HOME/.openMSX/share/systemroms"
          mkdir -p "$rom_pool"
          cp "$rom_dir/nms8250_basic-bios2.rom" "$rom_pool/"
          cp "$rom_dir/sub.rom" "$rom_pool/nms8250_msx2sub.rom"
          cp "$rom_dir/disk.rom" "$rom_pool/nms8250_disk.rom"
          # Do not list, hexdump, or upload private system ROM contents.
          echo "Installed 3 temporary system ROM files for openMSX."

      - name: Boot standalone Z80 demo in openMSX and capture screen
        if: env.ROM_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s xvfb-run -a openmsx \
            -machine Philips_NMS_8250 \
            -diska z80/build/KBLASM.DSK \
            -script z80/tools/openmsx_smoke.tcl \
            2>&1 | tee "$RUNNER_TEMP/openmsx-smoke.log"
          grep -q 'OPENMSX_SMOKE_SCREENSHOT:' "$RUNNER_TEMP/openmsx-smoke.log"
          test -s z80/build/openmsx-smoke.png
          python3 z80/tools/check_openmsx_smoke.py z80/build/openmsx-smoke.png
          echo "### openMSX: standalone smoke PASSED" >> "$GITHUB_STEP_SUMMARY"
          echo "Four fonts/colour image captured; visual/pixel-equivalence not yet asserted." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload emulator screenshot and smoke log (no ROMs)
        if: env.ROM_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openmsx-NMS8250-standalone-smoke
          path: z80/build/openmsx-smoke.png
          if-no-files-found: error
          retention-days: 14

      - name: Remove private ROM files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/openmsx-roms" "$HOME/.openMSX/share/systemroms"
