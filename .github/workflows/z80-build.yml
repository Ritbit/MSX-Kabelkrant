          python3 z80/tools/make_title_wipe.py \
            --asm z80/asm/.generated_title_wipe.asm \
            --lean-loop z80/build/wipe_lean/LOOP.SYS \
            --output-loop z80/build/title_wipe/LOOP.SYS
          (cd z80/asm && sjasmplus --raw=../build/title_wipe.raw --lst=../build/title_wipe.lst --sym=../build/title_wipe.sym .generated_title_wipe.asm)
          python3 z80/tools/make_bload.py z80/build/title_wipe.raw z80/build/KBLTXTTITLE.BIN
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack_from
          b=Path('z80/build/KBLTXTTITLE.BIN').read_bytes()
          start,end,entry=unpack_from('<HHH',b,1)
          assert (start,entry)==(0xC804,0xC806)
          assert end<0xD804, f"Title extension exceeds safe 4KiB slot: {end:04X}"
          print(f'Dedicated title wipe resident code: {len(b)-7} bytes; {0xD804-end-1} bytes free')
          PY
          python3 z80/tools/make_onefile_preview.py --ramdisk src/RAMDISK.BIN --text z80/build/KBLTXTTITLE.BIN --output z80/build/KBLRAMTITLE.BIN
          cp z80/build/KBLWIPELEAN.DSK z80/build/KBLTITLE.DSK
          mcopy -o -i z80/build/KBLTITLE.DSK z80/build/title_wipe/LOOP.SYS ::LOOP.SYS
          mcopy -o -i z80/build/KBLTITLE.DSK z80/build/KBLRAMTITLE.BIN ::RAMDISK.BIN
          python3 -m unittest discover -s z80/tests -p 'test_title_wipe.py' -v
          cp z80/build/KBLTITLE.DSK z80/build/KBLTITLECOPY.DSK
