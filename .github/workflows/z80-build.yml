      - name: Upload original BASIC reference disk
        uses: actions/upload-artifact@v4
        with:
          name: KBLBASE-original-BASIC-four-font-testdisk
          path: z80/build/KBLBASE.DSK
          if-no-files-found: error
      - name: Upload isolated demo disk (emulator test required)
        uses: actions/upload-artifact@v4
        with:
          name: KBLASM-experimental-MSX2-testdisk
          path: z80/build/KBLASM.DSK
          if-no-files-found: error
      - name: Upload prototype (NOT bootable)
        uses: actions/upload-artifact@v4
        with:
          name: z80-prototype-NOT-BOOTABLE
          path: |
            z80/build/kernel.raw
            z80/build/kernel.lst
            z80/build/kernel.sym
            z80/build/FONTS.DAT
            z80/build/textdemo.raw
            z80/build/textdemo.lst
            z80/build/textdemo.sym
            z80/build/KBLTXT.BIN
          if-no-files-found: error

  # The build always runs. This emulator job only starts when all four
  # user-provided ROM secrets exist. No BIOS bytes enter the repository or
  # published artifacts. See BUILD-AND-TEST.md for secret setup.
  openmsx-smoke:
    name: openMSX NMS 8250 runtime smoke
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MSX_NMS8250_MAIN32_B64: ${{ secrets.MSX_NMS8250_MAIN32_B64 }}
      MSX_NMS8250_SUB16_B64: ${{ secrets.MSX_NMS8250_SUB16_B64 }}
      MSX_NMS8250_DISK16_B64: ${{ secrets.MSX_NMS8250_DISK16_B64 }}
      MSX_NMS8250_BIOS_B64: ${{ secrets.MSX_NMS8250_BIOS_B64 }}
      MSX_NMS8250_BASIC_B64: ${{ secrets.MSX_NMS8250_BASIC_B64 }}
      MSX_NMS8250_SUB_B64: ${{ secrets.MSX_NMS8250_SUB_B64 }}
      MSX_NMS8250_DISK_B64: ${{ secrets.MSX_NMS8250_DISK_B64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Download latest accepted title wipe alpha and C test disk
        uses: actions/download-artifact@v4
        with:
          name: KBLTITLE-ONLY-TWO-BARS-ALPHA
          path: z80/build
      - name: Download auto C regression image
        uses: actions/download-artifact@v4
        with:
          name: KBLCTESTAUTO-private-ROM-runtime
          path: z80/build

      - name: Download standalone Z80 disk from this run
        uses: actions/download-artifact@v4
        with:
          name: KBLASM-experimental-MSX2-testdisk
          path: z80/build

      - name: Determine whether system ROMs were configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$MSX_NMS8250_MAIN32_B64" && -n "$MSX_NMS8250_SUB16_B64" && -n "$MSX_NMS8250_DISK16_B64" ]]; then
            echo "ROM_READY=true" >> "$GITHUB_ENV"
            echo "ROM_LAYOUT=3" >> "$GITHUB_ENV"
            echo "ROM layout: one 32KiB BIOS+BASIC, two 16KiB sub/disk files."
          elif [[ -n "$MSX_NMS8250_BIOS_B64" && -n "$MSX_NMS8250_BASIC_B64" && -n "$MSX_NMS8250_SUB_B64" && -n "$MSX_NMS8250_DISK_B64" ]]; then
            echo "ROM_READY=true" >> "$GITHUB_ENV"
            echo "ROM_LAYOUT=4" >> "$GITHUB_ENV"
            echo "ROM layout: legacy four 16KiB files."
          elif [[ "${{ github.event.head_commit.message }}" == *"[nms8250-rom-test]"* ]]; then
            # One-off explicit opt-in. Do NOT download system ROMs on
            # every push: respect the archive's download policy.
            echo "ROM_READY=true" >> "$GITHUB_ENV"
            echo "ROM_LAYOUT=remote" >> "$GITHUB_ENV"
            echo "NMS8250: one-shot test with user-supplied public ROM URLs."
          else
            echo "ROM_READY=false" >> "$GITHUB_ENV"
            echo "ROM_LAYOUT=none" >> "$GITHUB_ENV"
            echo "::warning::openMSX emulator tests SKIPPED: configure NMS8250 ROM secrets for either 32+16+16 layout (preferred) or legacy 4x16."
            echo "### openMSX runtime: SKIPPED (ROM secrets not configured)" >> "$GITHUB_STEP_SUMMARY"
            echo "Build and static tests are not an emulator run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install headless emulator
        if: env.ROM_READY == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openmsx openmsx-data xvfb python3-pil mtools
          test "$(stat -c %s z80/build/KBLASM.DSK)" -eq 737280

      - name: Decode NMS 8250 ROMs into ephemeral private directory
        if: env.ROM_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          rom_dir="$RUNNER_TEMP/openmsx-roms"
          mkdir -p "$rom_dir"
          if [[ "$ROM_LAYOUT" == "remote" ]]; then
            # Explicit opt-in regression only. Download the four maintainer-provided
            # split ROMs into the ephemeral runner directory, never into the repo.
            # On errors, fail rather than retrying previously rejected endpoints.
            rombase="https://download.file-hunter.com/System%20ROMs/machines/philips"
            curl -A "Mozilla/5.0" -fLsS --retry 0 --connect-timeout 10 --max-time 45 \
              "$rombase/nms8250-bios.rom" -o "$rom_dir/bios.rom"
            curl -A "Mozilla/5.0" -fLsS --retry 0 --connect-timeout 10 --max-time 45 \
              "$rombase/nms8250-basic.rom" -o "$rom_dir/basic.rom"
            curl -A "Mozilla/5.0" -fLsS --retry 0 --connect-timeout 10 --max-time 45 \
              "$rombase/nms8250_msx2sub.rom" -o "$rom_dir/nms8250_msx2sub.rom"
            curl -A "Mozilla/5.0" -fLsS --retry 0 --connect-timeout 10 --max-time 45 \
              "$rombase/nms8250_disk.rom" -o "$rom_dir/nms8250_disk.rom"
            test "$(stat -c %s "$rom_dir/bios.rom")" -eq 16384
            test "$(stat -c %s "$rom_dir/basic.rom")" -eq 16384
            cat "$rom_dir/bios.rom" "$rom_dir/basic.rom" > "$rom_dir/nms8250_basic-bios2.rom"
          elif [[ "$ROM_LAYOUT" == "3" ]]; then
            printf '%s' "$MSX_NMS8250_MAIN32_B64" | base64 --decode > "$rom_dir/nms8250_basic-bios2.rom"
            printf '%s' "$MSX_NMS8250_SUB16_B64" | base64 --decode > "$rom_dir/nms8250_msx2sub.rom"
            printf '%s' "$MSX_NMS8250_DISK16_B64" | base64 --decode > "$rom_dir/nms8250_disk.rom"
          elif [[ "$ROM_LAYOUT" == "4" ]]; then
            printf '%s' "$MSX_NMS8250_BIOS_B64" | base64 --decode > "$rom_dir/bios.rom"
            printf '%s' "$MSX_NMS8250_BASIC_B64" | base64 --decode > "$rom_dir/basic.rom"
            printf '%s' "$MSX_NMS8250_SUB_B64" | base64 --decode > "$rom_dir/nms8250_msx2sub.rom"
            printf '%s' "$MSX_NMS8250_DISK_B64" | base64 --decode > "$rom_dir/nms8250_disk.rom"
            test "$(stat -c %s "$rom_dir/bios.rom")" -eq 16384
            test "$(stat -c %s "$rom_dir/basic.rom")" -eq 16384
            cat "$rom_dir/bios.rom" "$rom_dir/basic.rom" > "$rom_dir/nms8250_basic-bios2.rom"
          else
            echo "::error::Invalid ROM layout"
            exit 1
          fi
          test "$(stat -c %s "$rom_dir/nms8250_basic-bios2.rom")" -eq 32768
          test "$(stat -c %s "$rom_dir/nms8250_msx2sub.rom")" -eq 16384
          test "$(stat -c %s "$rom_dir/nms8250_disk.rom")" -eq 16384
          rom_pool="$HOME/.openMSX/share/systemroms"
          mkdir -p "$rom_pool"
          cp "$rom_dir/nms8250_basic-bios2.rom" "$rom_pool/"
          cp "$rom_dir/nms8250_msx2sub.rom" "$rom_pool/"
          cp "$rom_dir/nms8250_disk.rom" "$rom_pool/"
          echo "NMS8250 system ROM lengths verified (32+16+16 KiB); contents remain private."

      - name: Boot standalone Z80 demo in openMSX and capture screen
        if: env.ROM_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s xvfb-run -a openmsx \
            -machine Philips_NMS_8250 \
            -diska z80/build/KBLASM.DSK \
            -script z80/tools/openmsx_smoke.tcl \
            2>&1 | tee "$RUNNER_TEMP/openmsx-smoke.log"
          grep -q 'OPENMSX_SMOKE_SCREENSHOT:' z80/build/openmsx-smoke.done
          test -s z80/build/openmsx-smoke.png
          python3 z80/tools/check_openmsx_smoke.py z80/build/openmsx-smoke.png
          echo "### openMSX: standalone smoke PASSED" >> "$GITHUB_STEP_SUMMARY"
          echo "Four fonts/colour image captured; visual/pixel-equivalence not yet asserted." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload emulator screenshot and smoke log (no ROMs)
        if: always() && env.ROM_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openmsx-NMS8250-standalone-smoke
          path: |
            z80/build/openmsx-smoke.png
            z80/build/openmsx-smoke.done
          if-no-files-found: warn
          retention-days: 14

      - name: Run multi-page full Kabelkrant regression in NMS8250
        if: always() && env.ROM_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p z80/build/openmsx-regression
          test "$(stat -c %s z80/build/KBLTITLECOPY.DSK)" -eq 737280
          cp z80/build/KBLTITLECOPY.DSK "$RUNNER_TEMP/KBLTITLE-RUNTIME.DSK"
          KBL_CASE=loop timeout 180s xvfb-run -a openmsx \
            -machine Philips_NMS_8250 \
            -diska "$RUNNER_TEMP/KBLTITLE-RUNTIME.DSK" \
            -script z80/tools/openmsx_regression.tcl \
            > "$RUNNER_TEMP/kbl-loop.log" 2>&1
          grep -q 'KBL_LOOP_TRACE_DONE' z80/build/openmsx-regression/loop.done
          python3 z80/tools/check_openmsx_regression.py \
            --case loop --output z80/build/openmsx-regression/loop-summary.json
          echo "### NMS8250: 210-second newspaper captures verified" >> "$GITHUB_STEP_SUMMARY"
      - name: Run C read/write/delete proof on disposable test floppy
        if: always() && env.ROM_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp z80/build/KBLCTESTAUTO.DSK "$RUNNER_TEMP/KBLCTEST-RUNTIME.DSK"
          KBL_CASE=ctest timeout 120s xvfb-run -a openmsx \
            -machine Philips_NMS_8250 \
            -diska "$RUNNER_TEMP/KBLCTEST-RUNTIME.DSK" \
            -script z80/tools/openmsx_regression.tcl \
            > "$RUNNER_TEMP/kbl-ctest.log" 2>&1
          grep -q 'KBL_CTEST_TRACE_DONE' z80/build/openmsx-regression/ctest.done
          python3 z80/tools/check_openmsx_regression.py \
            --case ctest --output z80/build/openmsx-regression/ctest-summary.json
          mcopy -i "$RUNNER_TEMP/KBLCTEST-RUNTIME.DSK" ::KBLPASS.OK - \
            | grep -q '^PASS C: RW DELETE'
          echo "### NMS8250: C: write/read/compare/delete PASS (MSX proof marker)" >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise menu editor save and return on disposable NMS8250 disk
        if: always() && env.ROM_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p z80/build/openmsx-editor
          cp z80/build/KBLTITLECOPY.DSK "$RUNNER_TEMP/KBL-EDITOR-RUNTIME.DSK"
          KBL_CASE=editor timeout 180s xvfb-run -a openmsx \
            -machine Philips_NMS_8250 \
            -diska "$RUNNER_TEMP/KBL-EDITOR-RUNTIME.DSK" \
            -script z80/tools/openmsx_editor_smoke.tcl \
            > "$RUNNER_TEMP/kbl-editor.log" 2>&1
          grep -q 'KBL_EDITOR_TRACE_DONE' z80/build/openmsx-editor/editor.done
          mcopy -i "$RUNNER_TEMP/KBL-EDITOR-RUNTIME.DSK" ::Z8REG26.TXT - \
            | grep -q 'Z80EDITORTEST'
          python3 z80/tools/check_editor_smoke.py
          echo "### NMS8250: operator menu/editor write to A:, return to live pages PASS" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload menu/editor evidence, even on failed scenario (no ROMs)
        if: always() && env.ROM_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openmsx-NMS8250-editor-smoke
          path: |
            z80/build/openmsx-editor/*.png
            z80/build/openmsx-editor/*.done
          if-no-files-found: warn
          retention-days: 14

      - name: Upload NMS8250 integration captures, summaries, no ROMs
        if: always() && env.ROM_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openmsx-NMS8250-integration-regression
          path: |
            z80/build/openmsx-regression/*.png
            z80/build/openmsx-regression/*.json
            z80/build/openmsx-regression/*.done
          if-no-files-found: warn
          retention-days: 14

      - name: Remove private ROM files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/openmsx-roms" "$HOME/.openMSX/share/systemroms"
