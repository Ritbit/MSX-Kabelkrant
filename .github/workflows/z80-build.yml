name: Z80 build and emulator smoke tests
# ROM-backed regression opt-in uses [nms8250-rom-test] in the triggering commit.
# Final C: proof fixture: reuse BASIC file handle #1; inspect generated artifact.
# Editor integration test is opt-in on a disposable disk and preserves A: proof.
# Keyboard event timings allow for slow BASIC menu transitions.
on:
  push:
    branches: [feature/z80-renderer]
    paths: ['.github/workflows/z80-build.yml', 'z80/**', 'src/X.DAT']
  workflow_dispatch:

concurrency:
  group: z80-preview-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build SjASMPlus 1.24.0
        run: |
          git clone --recursive --depth 1 --branch v1.24.0 https://github.com/z00m128/sjasmplus.git /tmp/sjasmplus
          cmake -S /tmp/sjasmplus -B /tmp/sjasmplus-build -DCMAKE_BUILD_TYPE=Release -DENABLE_LUA=OFF -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/sjasmplus-build --parallel 2
          sudo cmake --install /tmp/sjasmplus-build
          sjasmplus --version
      - name: Convert and verify original fonts
        run: python3 z80/tools/convert_fonts.py --xdat src/X.DAT --output z80/build/FONTS.DAT
      - name: Run font conversion tests
        run: python3 -m unittest discover -s z80/tests -p 'test_conversion.py' -v
      - name: Audit ASCII 33-127 font coverage
        run: python3 -m unittest discover -s z80/tests -p 'test_charset.py' -v
      - name: Assemble Z80 prototype
        run: |
          (cd z80/asm && sjasmplus --raw=../build/kernel.raw --lst=../build/kernel.lst --sym=../build/kernel.sym kernel.asm)
          test -s z80/build/kernel.raw
      - name: Assemble isolated V9938 wipe #1 prototype (not connected to broadcast)
        run: |
          python3 -m unittest discover -s z80/tests -p 'test_wipe_kernel.py' -v
          (cd z80/asm && sjasmplus --raw=../build/wipe1.raw --lst=../build/wipe1.lst wipe_forward.asm)
          test -s z80/build/wipe1.raw
          python3 z80/tools/make_bload.py z80/build/wipe1.raw z80/build/WIPE1.BIN
          test -s z80/build/WIPE1.BIN
          (cd z80/asm && sjasmplus --raw=../build/wipe2.raw --lst=../build/wipe2.lst wipe_reverse.asm)
          python3 z80/tools/make_bload.py z80/build/wipe2.raw z80/build/WIPE2.BIN
          test -s z80/build/WIPE2.BIN
          python3 -m unittest discover -s z80/tests -p 'test_wipe_binary.py' -v
          (cd z80/asm && sjasmplus --raw=../build/wipe3.raw --lst=../build/wipe3.lst wipe_lr.asm)
          python3 z80/tools/make_bload.py z80/build/wipe3.raw z80/build/WIPE3.BIN
          (cd z80/asm && sjasmplus --raw=../build/wipe4.raw --lst=../build/wipe4.lst wipe_rl.asm)
          python3 z80/tools/make_bload.py z80/build/wipe4.raw z80/build/WIPE4.BIN
          (cd z80/asm && sjasmplus --raw=../build/wipe5.raw --lst=../build/wipe5.lst wipe_tb_centre.asm)
          python3 z80/tools/make_bload.py z80/build/wipe5.raw z80/build/WIPE5.BIN
          (cd z80/asm && sjasmplus --raw=../build/wipe6.raw --lst=../build/wipe6.lst wipe_lr_centre.asm)
          python3 z80/tools/make_bload.py z80/build/wipe6.raw z80/build/WIPE6.BIN
          (cd z80/asm && sjasmplus --raw=../build/wipe7.raw --lst=../build/wipe7.lst wipe_tb_outward.asm)
          python3 z80/tools/make_bload.py z80/build/wipe7.raw z80/build/WIPE7.BIN
          (cd z80/asm && sjasmplus --raw=../build/wipe8.raw --lst=../build/wipe8.lst wipe_lr_outward.asm)
          python3 z80/tools/make_bload.py z80/build/wipe8.raw z80/build/WIPE8.BIN
          (cd z80/asm && sjasmplus --raw=../build/wipe9.raw --lst=../build/wipe9.lst wipe_box_in.asm)
          python3 z80/tools/make_bload.py z80/build/wipe9.raw z80/build/WIPE9.BIN
          (cd z80/asm && sjasmplus --raw=../build/wipe10.raw --lst=../build/wipe10.lst wipe_box_out.asm)
          python3 z80/tools/make_bload.py z80/build/wipe10.raw z80/build/WIPE10.BIN
          (cd z80/asm && sjasmplus --raw=../build/wipe11.raw --lst=../build/wipe11.lst wipe11.asm)
          python3 z80/tools/make_bload.py z80/build/wipe11.raw z80/build/WIPE11.BIN
          (cd z80/asm && sjasmplus --raw=../build/wipe12.raw --lst=../build/wipe12.lst wipe12.asm)
          python3 z80/tools/make_bload.py z80/build/wipe12.raw z80/build/WIPE12.BIN
          (cd z80/asm && sjasmplus --raw=../build/wipe13.raw --lst=../build/wipe13.lst wipe13.asm)
          python3 z80/tools/make_bload.py z80/build/wipe13.raw z80/build/WIPE13.BIN
          (cd z80/asm && sjasmplus --raw=../build/wipe14.raw --lst=../build/wipe14.lst wipe14.asm)
          python3 z80/tools/make_bload.py z80/build/wipe14.raw z80/build/WIPE14.BIN
      - name: Assemble standalone CALL TEXT demo
        run: |
          (cd z80/asm && sjasmplus --raw=../build/textdemo.raw --lst=../build/textdemo.lst --sym=../build/textdemo.sym basic_text_demo.asm)
          python3 z80/tools/make_bload.py z80/build/textdemo.raw z80/build/KBLTXT.BIN
          python3 -m unittest discover -s z80/tests -p 'test_bload.py' -v
          python3 -m unittest discover -s z80/tests -p 'test_colour_mask.py' -v
      - name: Generate and assemble opt-in shared wipe extension
        run: |
          set -euo pipefail
          python3 z80/tools/make_wipe_integration.py
          (cd z80/asm && sjasmplus --raw=../build/textwipe.raw --lst=../build/textwipe.lst --sym=../build/textwipe.sym .generated_wipe_text.asm)
          python3 z80/tools/make_bload.py z80/build/textwipe.raw z80/build/KBLTXTWIPE.BIN
          python3 - <<'PY'
          import struct
          from pathlib import Path
          data=Path('z80/build/KBLTXTWIPE.BIN').read_bytes()
          start,end,entry=struct.unpack_from('<HHH',data,1)
          assert (start,entry)==(0xC804,0xC806)
          assert end < 0xD804, f"Integrated code exceeds safe 4KiB region: {end:04X}"
          print(f'Experimental WIPE TEXT footprint: {len(data)-7} bytes; final {end:04X}')
          PY
      - name: Generate and assemble compact 12-wipe integration extension
        run: |
          set -euo pipefail
          python3 z80/tools/make_wipe_integration.py --extra --asm z80/asm/.generated_wipe12_text.asm --loop z80/build/wipe_integration12/LOOP.SYS
          (cd z80/asm && sjasmplus --raw=../build/textwipe12.raw --lst=../build/textwipe12.lst --sym=../build/textwipe12.sym .generated_wipe12_text.asm)
          python3 z80/tools/make_bload.py z80/build/textwipe12.raw z80/build/KBLTXTWIPE12.BIN
          python3 - <<'PY'
          import struct
          from pathlib import Path
          b=Path('z80/build/KBLTXTWIPE12.BIN').read_bytes()
          start,end,entry=struct.unpack_from('<HHH',b,1)
          assert (start,entry)==(0xC804,0xC806)
          assert end < 0xD804, f"12-wipe engine spills beyond D803: {end:04X}"
          print(f'Shared 12-wipe resident payload {len(b)-7} bytes; end {end:04X}')
          PY
      - name: Generate and assemble full 14-wipe resident extension
        run: |
          set -euo pipefail
          python3 z80/tools/make_wipe_integration.py --full --asm z80/asm/.generated_wipe14_text.asm --loop z80/build/wipe_integration14/LOOP.SYS
          (cd z80/asm && sjasmplus --raw=../build/textwipe14.raw --lst=../build/textwipe14.lst --sym=../build/textwipe14.sym .generated_wipe14_text.asm)
          python3 z80/tools/make_bload.py z80/build/textwipe14.raw z80/build/KBLTXTWIPE14.BIN
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack_from
          b=Path('z80/build/KBLTXTWIPE14.BIN').read_bytes()
          start,end,entry=unpack_from('<HHH',b,1)
          assert (start,entry)==(0xC804,0xC806)
          assert end < 0xD804, f"14-wipe engine exceeds reserved 4KiB area: {end:04X}"
          print(f'Shared 14-wipe resident payload: {len(b)-7} bytes; end {end:04X}')
          PY
      - name: Audit current 4KiB TEXT plus wipe memory budget
        run: python3 z80/tools/audit_wipe_memory.py
      - name: Verify original RAMdisk storage bounds
        run: |
          python3 z80/tools/ramdisk_layout.py
          python3 -m unittest discover -s z80/tests -p 'test_ramdisk_layout.py' -v
          echo "::warning::Combined ROM experimental: RAMdisk zero-fills the TEXT entry at 46F5h."
      - name: Test and assemble combined RAMdisk+TEXT disk ROM
        run: |
          python3 -m unittest discover -s z80/tests -p 'test_combined_rom.py' -v
          python3 z80/tools/make_combined_rom.py --root . --output z80/build
          (cd z80/asm && sjasmplus --raw=../build/combined_text.raw --lst=../build/combined_text.lst --sym=../build/combined_text.sym .generated_combined.asm)
          python3 z80/tools/make_combined_rom.py --root . --output z80/build --extension z80/build/combined_text.raw
          test -s z80/build/KBLALL.BIN
      - name: Validate MSX BASIC ASCII formatting
        run: |
          python3 -m unittest discover -s z80/tests -p 'test_msx_basic_ascii.py' -v
          python3 z80/tools/msx_basic_ascii.py z80/asm/ASMTEXT.BAS z80/build/ASMTEXT.BAS
          python3 z80/tools/msx_basic_ascii.py z80/asm/ASMBOOT.BAS z80/build/AUTOEXEC.BAS
      - name: Generate original BASIC four-font reference
        run: |
          python3 z80/tools/make_font_baseline.py --source src/LOOP.SYS --output z80/build/FONTBAS.BAS
          python3 z80/tools/make_font_baseline.py --source src/LOOP.SYS --output z80/build/FONTCOL.BAS --colour-test
          python3 -m unittest discover -s z80/tests -p 'test_font_baseline.py' -v
      - name: Generate A/B renderer benchmarks
        run: |
          python3 z80/tools/benchmark_basic.py --disk assets/kabelkrant-6.2.dsk --optimized src/LOOP.SYS --output z80/build
      - name: Create isolated MSX2 demo disk
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mtools
          cp assets/kabelkrant-6.2.dsk z80/build/KBLASM.DSK
          # The stand-alone emulator regression does not initialize RAMDISK.BIN.
          # RAMDISK+C004 coexistence is tracked as a separate integration task.
          printf '10 SCREEN 0:WIDTH 80:COLOR 15,4,4\r\n20 PRINT "KABELKRANT Z80 CALL TEXT TEST"\r\n30 RUN "ASMTEXT.BAS"\r\n' > z80/build/AUTOEXEC.BAS
          mcopy -o -i z80/build/KBLASM.DSK z80/build/AUTOEXEC.BAS ::AUTOEXEC.BAS
          mcopy -o -i z80/build/KBLASM.DSK z80/build/ASMTEXT.BAS ::ASMTEXT.BAS
          mcopy -o -i z80/build/KBLASM.DSK z80/build/FONTBAS.BAS ::FONTBAS.BAS
          mcopy -o -i z80/build/KBLASM.DSK z80/build/KBLTXT.BIN ::KBLTXT.BIN
          mdir -i z80/build/KBLASM.DSK ::
          test "$(stat -c %s z80/build/KBLASM.DSK)" -eq 737280
      - name: Build isolated wipe-one demonstration disk
        run: |
          cp assets/kabelkrant-6.2.dsk z80/build/KBLWIPE.DSK
          printf '%s\r\n' \
            '10 CLEAR 1000,&HC7FF:SCREEN 7:COLOR 15,0,0' \
            '20 CLS:LINE(0,50)-(511,211),14,BF' \
            '30 LINE(0,50)-(511,211),1,B' \
            '40 FOR T=1 TO 1000:NEXT T' \
            '50 BLOAD "WIPE1.BIN",R' \
            '60 FOR T=1 TO 1000:NEXT T' \
            '70 GOTO 20' > z80/build/WIPEAUTO.BAS
          mcopy -o -i z80/build/KBLWIPE.DSK z80/build/WIPEAUTO.BAS ::AUTOEXEC.BAS
          mcopy -o -i z80/build/KBLWIPE.DSK z80/build/WIPE1.BIN ::WIPE1.BIN
          test "$(stat -c %s z80/build/KBLWIPE.DSK)" -eq 737280
          mdir -i z80/build/KBLWIPE.DSK ::WIPE1.BIN
      - name: Build isolated bottom-up wipe demonstration disk
        run: |
          cp assets/kabelkrant-6.2.dsk z80/build/KBLWIPE2.DSK
          printf '%s\r\n' \
            '10 CLEAR 1000,&HC7FF:SCREEN 7:COLOR 15,0,0' \
            '20 CLS:LINE(0,50)-(511,211),14,BF:LOCATE 0,0:PRINT "WIPE 2: BOTTOM TO TOP"' \
            '30 LINE(0,50)-(511,211),1,B' \
            '40 FOR T=1 TO 1000:NEXT T' \
            '50 BLOAD "WIPE2.BIN",R' \
            '60 FOR T=1 TO 1000:NEXT T' \
            '70 GOTO 20' > z80/build/WIPEAUTO2.BAS
          mcopy -o -i z80/build/KBLWIPE2.DSK z80/build/WIPEAUTO2.BAS ::AUTOEXEC.BAS
          mcopy -o -i z80/build/KBLWIPE2.DSK z80/build/WIPE2.BIN ::WIPE2.BIN
          test "$(stat -c %s z80/build/KBLWIPE2.DSK)" -eq 737280
          cmp <(mcopy -i z80/build/KBLWIPE2.DSK ::WIPE2.BIN -) z80/build/WIPE2.BIN
          if mdir -b -i z80/build/KBLWIPE2.DSK ::WIPE1.BIN >/dev/null 2>&1; then
            echo "::error::Wipe2 demo unexpectedly contains wipe1 binary"
            exit 1
          fi
      - name: Build horizontal wipe #3 and #4 standalone disks
        run: |
          set -euo pipefail
          for num in 3 4; do
            cp assets/kabelkrant-6.2.dsk "z80/build/KBLWIPE${num}.DSK"
            if [[ "$num" -eq 3 ]]; then
              description="LEFT TO RIGHT"
            else
              description="RIGHT TO LEFT"
            fi
            printf '%s\r\n' \
              '10 CLEAR 1000,&HC7FF:SCREEN 7:COLOR 15,0,0' \
              "20 CLS:LINE(0,50)-(511,211),14,BF:LOCATE 0,0:PRINT \"WIPE ${num}: ${description}\"" \
              '30 LINE(0,50)-(511,211),1,B' \
              '40 FOR T=1 TO 1000:NEXT T' \
              "50 BLOAD \"WIPE${num}.BIN\",R" \
              '60 FOR T=1 TO 1000:NEXT T' \
              '70 GOTO 20' > "z80/build/WIPEAUTO${num}.BAS"
            mcopy -o -i "z80/build/KBLWIPE${num}.DSK" "z80/build/WIPEAUTO${num}.BAS" ::AUTOEXEC.BAS
            mcopy -o -i "z80/build/KBLWIPE${num}.DSK" "z80/build/WIPE${num}.BIN" "::WIPE${num}.BIN"
            test "$(stat -c %s "z80/build/KBLWIPE${num}.DSK")" -eq 737280
          done
          python3 -m unittest discover -s z80/tests -p 'test_horizontal_wipes.py' -v
      - name: Build and test inward wipe #5/#6 standalone disks
        run: |
          set -euo pipefail
          for num in 5 6; do
            cp assets/kabelkrant-6.2.dsk "z80/build/KBLWIPE${num}.DSK"
            if [[ "$num" -eq 5 ]]; then
              description="TOP BOTTOM TO CENTRE"
            else
              description="LEFT RIGHT TO CENTRE"
            fi
            printf '%s\r\n' \
              '10 CLEAR 1000,&HC7FF:SCREEN 7:COLOR 15,0,0' \
              "20 CLS:LINE(0,50)-(511,211),14,BF:LOCATE 0,0:PRINT \"WIPE ${num}: ${description}\"" \
              '30 LINE(0,50)-(511,211),1,B' \
              '40 FOR T=1 TO 1000:NEXT T' \
              "50 BLOAD \"WIPE${num}.BIN\",R" \
              '60 FOR T=1 TO 1000:NEXT T' \
              '70 GOTO 20' > "z80/build/WIPEAUTO${num}.BAS"
            mcopy -o -i "z80/build/KBLWIPE${num}.DSK" "z80/build/WIPEAUTO${num}.BAS" ::AUTOEXEC.BAS
            mcopy -o -i "z80/build/KBLWIPE${num}.DSK" "z80/build/WIPE${num}.BIN" "::WIPE${num}.BIN"
            test "$(stat -c %s "z80/build/KBLWIPE${num}.DSK")" -eq 737280
          done
          python3 -m unittest discover -s z80/tests -p 'test_centre_wipes.py' -v
      - name: Build and verify centre-outward wipe #7/#8 disks
        run: |
          set -euo pipefail
          for num in 7 8; do
            cp assets/kabelkrant-6.2.dsk "z80/build/KBLWIPE${num}.DSK"
            if [[ "$num" -eq 7 ]]; then
              description="CENTRE TO TOP BOTTOM"
            else
              description="CENTRE TO LEFT RIGHT"
            fi
            printf '%s\r\n' \
              '10 CLEAR 1000,&HC7FF:SCREEN 7:COLOR 15,0,0' \
              "20 CLS:LINE(0,50)-(511,211),14,BF:LOCATE 0,0:PRINT \"WIPE ${num}: ${description}\"" \
              '30 LINE(0,50)-(511,211),1,B' \
              '40 FOR T=1 TO 1000:NEXT T' \
              "50 BLOAD \"WIPE${num}.BIN\",R" \
              '60 FOR T=1 TO 1000:NEXT T' \
              '70 GOTO 20' > "z80/build/WIPEAUTO${num}.BAS"
            mcopy -o -i "z80/build/KBLWIPE${num}.DSK" "z80/build/WIPEAUTO${num}.BAS" ::AUTOEXEC.BAS
            mcopy -o -i "z80/build/KBLWIPE${num}.DSK" "z80/build/WIPE${num}.BIN" "::WIPE${num}.BIN"
            test "$(stat -c %s "z80/build/KBLWIPE${num}.DSK")" -eq 737280
          done
          python3 -m unittest discover -s z80/tests -p 'test_outward_wipes.py' -v
      - name: Build and verify rectangular-outline wipe #9/#10 disks
        run: |
          set -euo pipefail
          for num in 9 10; do
            cp assets/kabelkrant-6.2.dsk "z80/build/KBLWIPE${num}.DSK"
            if [[ "$num" -eq 9 ]]; then
              description="OUTSIDE TO CENTRE"
            else
              description="CENTRE TO OUTSIDE"
            fi
            printf '%s\r\n' \
              '10 CLEAR 1000,&HC7FF:SCREEN 7:COLOR 15,0,0' \
              "20 CLS:LINE(0,50)-(511,211),14,BF:LOCATE 0,0:PRINT \"WIPE ${num}: ${description}\"" \
              '30 LINE(0,50)-(511,211),1,B' \
              '40 FOR T=1 TO 1000:NEXT T' \
              "50 BLOAD \"WIPE${num}.BIN\",R" \
              '60 FOR T=1 TO 1000:NEXT T' \
              '70 GOTO 20' > "z80/build/WIPEAUTO${num}.BAS"
            mcopy -o -i "z80/build/KBLWIPE${num}.DSK" "z80/build/WIPEAUTO${num}.BAS" ::AUTOEXEC.BAS
            mcopy -o -i "z80/build/KBLWIPE${num}.DSK" "z80/build/WIPE${num}.BIN" "::WIPE${num}.BIN"
            test "$(stat -c %s "z80/build/KBLWIPE${num}.DSK")" -eq 737280
          done
          python3 -m unittest discover -s z80/tests -p 'test_box_wipes.py' -v
      - name: Build and verify interlaced wipe #11/#12 disks
        run: |
          set -euo pipefail
          for num in 11 12; do
            cp assets/kabelkrant-6.2.dsk "z80/build/KBLWIPE${num}.DSK"
            if [[ "$num" -eq 11 ]]; then
              description="TOP BOTTOM INTERLACED"
            else
              description="LEFT RIGHT INTERLACED"
            fi
            printf '%s\r\n' \
              '10 CLEAR 1000,&HC7FF:SCREEN 7:COLOR 15,0,0' \
              "20 CLS:LINE(0,50)-(511,211),14,BF:LOCATE 0,0:PRINT \"WIPE ${num}: ${description}\"" \
              '30 LINE(0,50)-(511,211),1,B' \
              '40 FOR T=1 TO 1000:NEXT T' \
              "50 BLOAD \"WIPE${num}.BIN\",R" \
              '60 FOR T=1 TO 1000:NEXT T' \
              '70 GOTO 20' > "z80/build/WIPEAUTO${num}.BAS"
            mcopy -o -i "z80/build/KBLWIPE${num}.DSK" "z80/build/WIPEAUTO${num}.BAS" ::AUTOEXEC.BAS
            mcopy -o -i "z80/build/KBLWIPE${num}.DSK" "z80/build/WIPE${num}.BIN" "::WIPE${num}.BIN"
            test "$(stat -c %s "z80/build/KBLWIPE${num}.DSK")" -eq 737280
          done
          python3 -m unittest discover -s z80/tests -p 'test_interlaced_wipes.py' -v
      - name: Build and verify final wipe #13/#14 disks
        run: |
          set -euo pipefail
          for num in 13 14; do
            cp assets/kabelkrant-6.2.dsk "z80/build/KBLWIPE${num}.DSK"
            if [[ "$num" -eq 13 ]]; then
              description="FOUR COLUMN INTERLACE"
            else
              description="FOUR RECTANGLES"
            fi
            printf '%s\r\n' \
              '10 CLEAR 1000,&HC7FF:SCREEN 7:COLOR 15,0,0' \
              "20 CLS:LINE(0,50)-(511,211),14,BF:LOCATE 0,0:PRINT \"WIPE ${num}: ${description}\"" \
              '30 LINE(0,50)-(511,211),1,B' \
              '40 FOR T=1 TO 1000:NEXT T' \
              "50 BLOAD \"WIPE${num}.BIN\",R" \
              '60 FOR T=1 TO 1000:NEXT T' \
              '70 GOTO 20' > "z80/build/WIPEAUTO${num}.BAS"
            mcopy -o -i "z80/build/KBLWIPE${num}.DSK" "z80/build/WIPEAUTO${num}.BAS" ::AUTOEXEC.BAS
            mcopy -o -i "z80/build/KBLWIPE${num}.DSK" "z80/build/WIPE${num}.BIN" "::WIPE${num}.BIN"
            test "$(stat -c %s "z80/build/KBLWIPE${num}.DSK")" -eq 737280
          done
          python3 -m unittest discover -s z80/tests -p 'test_last_wipes.py' -v
          # Cache-safe fixed preview, byte-identical to the CI-verified wipe14 image.
          cp z80/build/KBLWIPE14.DSK z80/build/KBLWIPE14FIX.DSK
          cmp z80/build/KBLWIPE14.DSK z80/build/KBLWIPE14FIX.DSK
          cmp <(mcopy -i z80/build/KBLWIPE14FIX.DSK ::WIPE14.BIN -) z80/build/WIPE14.BIN
          cp z80/build/KBLWIPE14.DSK z80/build/KBLWIPE14FIX2.DSK
          cmp z80/build/KBLWIPE14.DSK z80/build/KBLWIPE14FIX2.DSK
          cmp <(mcopy -i z80/build/KBLWIPE14FIX2.DSK ::WIPE14.BIN -) z80/build/WIPE14.BIN
      - name: Upload final individual wipe demos (experimental)
        uses: actions/upload-artifact@v4
        with:
          name: KBLWIPE13-14-EXPERIMENTAL
          path: |
            z80/build/KBLWIPE13.DSK
            z80/build/KBLWIPE14.DSK
            z80/build/KBLWIPE14FIX.DSK
            z80/build/KBLWIPE14FIX2.DSK
          if-no-files-found: error
      - name: Upload interlaced wipe demos (experimental)
        uses: actions/upload-artifact@v4
        with:
          name: KBLWIPE11-12-INTERLACED-EXPERIMENTAL
          path: |
            z80/build/KBLWIPE11.DSK
            z80/build/KBLWIPE12.DSK
          if-no-files-found: error
      - name: Upload rectangular-outline wipe demos (experimental)
        uses: actions/upload-artifact@v4
        with:
          name: KBLWIPE9-10-RECTANGULAR-OUTLINES
          path: |
            z80/build/KBLWIPE9.DSK
            z80/build/KBLWIPE10.DSK
          if-no-files-found: error
      - name: Upload isolated centre-outward wipe disks (experimental)
        uses: actions/upload-artifact@v4
        with:
          name: KBLWIPE7-8-OUTWARD-EXPERIMENTAL
          path: |
            z80/build/KBLWIPE7.DSK
            z80/build/KBLWIPE8.DSK
          if-no-files-found: error
      - name: Upload isolated inward wipe disks (experimental)
