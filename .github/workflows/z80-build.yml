name: Z80 build and emulator smoke tests
on:
  push:
    branches: [feature/z80-renderer]
    paths: ['.github/workflows/z80-build.yml', 'z80/**', 'src/X.DAT']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build SjASMPlus 1.24.0
        run: |
          git clone --recursive --depth 1 --branch v1.24.0 https://github.com/z00m128/sjasmplus.git /tmp/sjasmplus
          cmake -S /tmp/sjasmplus -B /tmp/sjasmplus-build -DCMAKE_BUILD_TYPE=Release -DENABLE_LUA=OFF -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/sjasmplus-build --parallel 2
          sudo cmake --install /tmp/sjasmplus-build
          sjasmplus --version
      - name: Convert and verify original fonts
        run: python3 z80/tools/convert_fonts.py --xdat src/X.DAT --output z80/build/FONTS.DAT
      - name: Run font conversion tests
        run: python3 -m unittest discover -s z80/tests -p 'test_conversion.py' -v
      - name: Audit ASCII 33-127 font coverage
        run: python3 -m unittest discover -s z80/tests -p 'test_charset.py' -v
      - name: Assemble Z80 prototype
        run: |
          (cd z80/asm && sjasmplus --raw=../build/kernel.raw --lst=../build/kernel.lst --sym=../build/kernel.sym kernel.asm)
          test -s z80/build/kernel.raw
      - name: Assemble standalone CALL TEXT demo
        run: |
          (cd z80/asm && sjasmplus --raw=../build/textdemo.raw --lst=../build/textdemo.lst --sym=../build/textdemo.sym basic_text_demo.asm)
          python3 z80/tools/make_bload.py z80/build/textdemo.raw z80/build/KBLTXT.BIN
          python3 -m unittest discover -s z80/tests -p 'test_bload.py' -v
      - name: Verify original RAMdisk storage bounds
        run: |
          python3 z80/tools/ramdisk_layout.py
          python3 -m unittest discover -s z80/tests -p 'test_ramdisk_layout.py' -v
          echo "::warning::Combined ROM experimental: RAMdisk zero-fills the TEXT entry at 46F5h."
      - name: Test and assemble combined RAMdisk+TEXT disk ROM
        run: |
          python3 -m unittest discover -s z80/tests -p 'test_combined_rom.py' -v
          python3 z80/tools/make_combined_rom.py --root . --output z80/build
          (cd z80/asm && sjasmplus --raw=../build/combined_text.raw --lst=../build/combined_text.lst --sym=../build/combined_text.sym .generated_combined.asm)
          python3 z80/tools/make_combined_rom.py --root . --output z80/build --extension z80/build/combined_text.raw
          test -s z80/build/KBLALL.BIN
      - name: Validate MSX BASIC ASCII formatting
        run: |
          python3 -m unittest discover -s z80/tests -p 'test_msx_basic_ascii.py' -v
          python3 z80/tools/msx_basic_ascii.py z80/asm/ASMTEXT.BAS z80/build/ASMTEXT.BAS
          python3 z80/tools/msx_basic_ascii.py z80/asm/ASMBOOT.BAS z80/build/AUTOEXEC.BAS
      - name: Generate original BASIC four-font reference
        run: |
          python3 z80/tools/make_font_baseline.py --source src/LOOP.SYS --output z80/build/FONTBAS.BAS
          python3 z80/tools/make_font_baseline.py --source src/LOOP.SYS --output z80/build/FONTCOL.BAS --colour-test
          python3 -m unittest discover -s z80/tests -p 'test_font_baseline.py' -v
      - name: Generate A/B renderer benchmarks
        run: |
          python3 z80/tools/benchmark_basic.py --disk assets/kabelkrant-6.2.dsk --optimized src/LOOP.SYS --output z80/build
      - name: Create isolated MSX2 demo disk
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mtools
          cp assets/kabelkrant-6.2.dsk z80/build/KBLASM.DSK
          # The stand-alone emulator regression does not initialize RAMDISK.BIN.
          # RAMDISK+C004 coexistence is tracked as a separate integration task.
          printf '10 SCREEN 0:WIDTH 80:COLOR 15,4,4\r\n20 PRINT "KABELKRANT Z80 CALL TEXT TEST"\r\n30 RUN "ASMTEXT.BAS"\r\n' > z80/build/AUTOEXEC.BAS
          mcopy -o -i z80/build/KBLASM.DSK z80/build/AUTOEXEC.BAS ::AUTOEXEC.BAS
          mcopy -o -i z80/build/KBLASM.DSK z80/build/ASMTEXT.BAS ::ASMTEXT.BAS
          mcopy -o -i z80/build/KBLASM.DSK z80/build/FONTBAS.BAS ::FONTBAS.BAS
          mcopy -o -i z80/build/KBLASM.DSK z80/build/KBLTXT.BIN ::KBLTXT.BIN
          mdir -i z80/build/KBLASM.DSK ::
          test "$(stat -c %s z80/build/KBLASM.DSK)" -eq 737280
      - name: Generate full Kabelkrant Z80 test BASIC files
        run: |
          python3 z80/tools/make_full_z80_test.py --root . --output z80/build/full
          python3 -m unittest discover -s z80/tests -p 'test_full_z80_test.py' -v
      - name: Checkout published 6.2b disk as read-only integration baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: z80/build/stable
          persist-credentials: false
      - name: Build full Kabelkrant Z80 preview image (NOT A RELEASE)
        run: |
          cp z80/build/stable/assets/kabelkrant-6.2b.dsk z80/build/KBLZ80TEST.DSK
          mcopy -i z80/build/KBLZ80TEST.DSK ::LOOP.SYS z80/build/full/LOOPBAS.SYS
          mcopy -o -i z80/build/KBLZ80TEST.DSK z80/build/full/LOOPBAS.SYS ::LOOPBAS.SYS
          mcopy -o -i z80/build/KBLZ80TEST.DSK z80/build/full/KBLINIT.SYS ::KBLINIT.SYS
          mcopy -o -i z80/build/KBLZ80TEST.DSK z80/build/full/LOOP.SYS ::LOOP.SYS
          mcopy -o -i z80/build/KBLZ80TEST.DSK z80/build/KBLTXT.BIN ::KBLTXT.BIN
          mdir -i z80/build/KBLZ80TEST.DSK ::KBLTXT.BIN
          test "$(stat -c %s z80/build/KBLZ80TEST.DSK)" -eq 737280
      - name: Upload full Kabelkrant Z80 preview disk (runtime testing required)
        uses: actions/upload-artifact@v4
        with:
          name: KBLZ80TEST-full-Kabelkrant-EXPERIMENTAL
          path: z80/build/KBLZ80TEST.DSK
          if-no-files-found: error
      - name: Create combined RAMdisk + Z80 TEXT experimental test disk
        run: |
          cp assets/kabelkrant-6.2.dsk z80/build/KBLCOMB.DSK
          mcopy -o -i z80/build/KBLCOMB.DSK z80/build/COMBAUTO.BAS ::AUTOEXEC.BAS
          mcopy -o -i z80/build/KBLCOMB.DSK z80/build/COMBTEXT.BAS ::COMBTEXT.BAS
          mcopy -o -i z80/build/KBLCOMB.DSK z80/build/KBLALL.BIN ::KBLALL.BIN
          mdir -i z80/build/KBLCOMB.DSK ::
          test "$(stat -c %s z80/build/KBLCOMB.DSK)" -eq 737280
      - name: Upload experimental combined RAMdisk and text image
        uses: actions/upload-artifact@v4
        with:
          name: KBLCOMB-KNOWN-UNSAFE-DO-NOT-RELEASE
          path: |
            z80/build/KBLCOMB.DSK
            z80/build/KBLALL.BIN
            z80/build/combined_text.lst
          if-no-files-found: error
      - name: Create original BASIC-only reference disk
        run: |
          cp assets/kabelkrant-6.2.dsk z80/build/KBLBASE.DSK
          printf '10 RUN "FONTBAS.BAS"\r\n' > z80/build/BASEAUTO.BAS
          mcopy -o -i z80/build/KBLBASE.DSK z80/build/BASEAUTO.BAS ::AUTOEXEC.BAS
          mcopy -o -i z80/build/KBLBASE.DSK z80/build/FONTBAS.BAS ::FONTBAS.BAS
          mcopy -o -i z80/build/KBLBASE.DSK z80/build/FONTCOL.BAS ::FONTCOL.BAS
          mdir -i z80/build/KBLBASE.DSK ::FONTBAS.BAS
          test "$(stat -c %s z80/build/KBLBASE.DSK)" -eq 737280
      - name: Create benchmark disk
        run: |
          cp assets/kabelkrant-6.2.dsk z80/build/KBLBENCH.DSK
          printf '10 RUN "BENCH1.BAS"\r\n' > z80/build/BENCHAUTO.BAS
          mcopy -o -i z80/build/KBLBENCH.DSK z80/build/BENCHAUTO.BAS ::AUTOEXEC.BAS
          mcopy -o -i z80/build/KBLBENCH.DSK z80/build/BENCH1.BAS ::BENCH1.BAS
          mcopy -o -i z80/build/KBLBENCH.DSK z80/build/BENCH3.BAS ::BENCH3.BAS
          mdir -i z80/build/KBLBENCH.DSK ::BENCH1.BAS
          mdir -i z80/build/KBLBENCH.DSK ::BENCH3.BAS
          test "$(stat -c %s z80/build/KBLBENCH.DSK)" -eq 737280
      - name: Upload original-versus-optimized BASIC benchmark disk
        uses: actions/upload-artifact@v4
        with:
          name: KBLBENCH-original-vs-optimized-BASIC
          path: z80/build/KBLBENCH.DSK
          if-no-files-found: error
      - name: Upload original BASIC reference disk
        uses: actions/upload-artifact@v4
        with:
          name: KBLBASE-original-BASIC-four-font-testdisk
          path: z80/build/KBLBASE.DSK
          if-no-files-found: error
      - name: Upload isolated demo disk (emulator test required)
        uses: actions/upload-artifact@v4
        with:
          name: KBLASM-experimental-MSX2-testdisk
          path: z80/build/KBLASM.DSK
          if-no-files-found: error
      - name: Upload prototype (NOT bootable)
        uses: actions/upload-artifact@v4
        with:
          name: z80-prototype-NOT-BOOTABLE
          path: |
            z80/build/kernel.raw
            z80/build/kernel.lst
            z80/build/kernel.sym
            z80/build/FONTS.DAT
            z80/build/textdemo.raw
            z80/build/textdemo.lst
            z80/build/textdemo.sym
            z80/build/KBLTXT.BIN
          if-no-files-found: error

  # The build always runs. This emulator job only starts when all four
  # user-provided ROM secrets exist. No BIOS bytes enter the repository or
  # published artifacts. See BUILD-AND-TEST.md for secret setup.
  openmsx-smoke:
    name: openMSX NMS 8250 runtime smoke
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MSX_NMS8250_BIOS_B64: ${{ secrets.MSX_NMS8250_BIOS_B64 }}
      MSX_NMS8250_BASIC_B64: ${{ secrets.MSX_NMS8250_BASIC_B64 }}
      MSX_NMS8250_SUB_B64: ${{ secrets.MSX_NMS8250_SUB_B64 }}
      MSX_NMS8250_DISK_B64: ${{ secrets.MSX_NMS8250_DISK_B64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Download standalone Z80 disk from this run
        uses: actions/download-artifact@v4
        with:
          name: KBLASM-experimental-MSX2-testdisk
          path: z80/build

      - name: Determine whether system ROMs were configured
        shell: bash
        run: |
          if [[ -n "$MSX_NMS8250_BIOS_B64" && -n "$MSX_NMS8250_BASIC_B64" && -n "$MSX_NMS8250_SUB_B64" && -n "$MSX_NMS8250_DISK_B64" ]]; then
            echo "ROM_READY=true" >> "$GITHUB_ENV"
          else
            echo "ROM_READY=false" >> "$GITHUB_ENV"
            echo "::warning::openMSX runtime smoke SKIPPED: four MSX_NMS8250_*_B64 repository secrets are needed."
            echo "### openMSX runtime: SKIPPED (ROM secrets not configured)" >> "$GITHUB_STEP_SUMMARY"
            echo "Build and Python unit tests are not emulator execution." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install headless emulator
        if: env.ROM_READY == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openmsx openmsx-data xvfb python3-pil
          test "$(stat -c %s z80/build/KBLASM.DSK)" -eq 737280

      - name: Decode four NMS 8250 ROMs into ephemeral private directory
        if: env.ROM_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          rom_dir="$RUNNER_TEMP/openmsx-roms"
          mkdir -p "$rom_dir"
          printf '%s' "$MSX_NMS8250_BIOS_B64" | base64 --decode > "$rom_dir/bios.rom"
          printf '%s' "$MSX_NMS8250_BASIC_B64" | base64 --decode > "$rom_dir/basic.rom"
          printf '%s' "$MSX_NMS8250_SUB_B64" | base64 --decode > "$rom_dir/sub.rom"
          printf '%s' "$MSX_NMS8250_DISK_B64" | base64 --decode > "$rom_dir/disk.rom"
          for part in bios basic sub disk; do
            test "$(stat -c %s "$rom_dir/$part.rom")" -eq 16384
          done
          # The NMS 8250 expects a combined 32KiB MSX BIOS+BASIC file.
          cat "$rom_dir/bios.rom" "$rom_dir/basic.rom" > "$rom_dir/nms8250_basic-bios2.rom"
          rom_pool="$HOME/.openMSX/share/systemroms"
          mkdir -p "$rom_pool"
          cp "$rom_dir/nms8250_basic-bios2.rom" "$rom_pool/"
          cp "$rom_dir/sub.rom" "$rom_pool/nms8250_msx2sub.rom"
          cp "$rom_dir/disk.rom" "$rom_pool/nms8250_disk.rom"
          # Do not list, hexdump, or upload private system ROM contents.
          echo "Installed 3 temporary system ROM files for openMSX."

      - name: Boot standalone Z80 demo in openMSX and capture screen
        if: env.ROM_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s xvfb-run -a openmsx \
            -machine Philips_NMS_8250 \
            -diska z80/build/KBLASM.DSK \
            -script z80/tools/openmsx_smoke.tcl \
            2>&1 | tee "$RUNNER_TEMP/openmsx-smoke.log"
          grep -q 'OPENMSX_SMOKE_SCREENSHOT:' "$RUNNER_TEMP/openmsx-smoke.log"
          test -s z80/build/openmsx-smoke.png
          python3 z80/tools/check_openmsx_smoke.py z80/build/openmsx-smoke.png
          echo "### openMSX: standalone smoke PASSED" >> "$GITHUB_STEP_SUMMARY"
          echo "Four fonts/colour image captured; visual/pixel-equivalence not yet asserted." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload emulator screenshot and smoke log (no ROMs)
        if: env.ROM_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openmsx-NMS8250-standalone-smoke
          path: z80/build/openmsx-smoke.png
          if-no-files-found: error
          retention-days: 14

      - name: Remove private ROM files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/openmsx-roms" "$HOME/.openMSX/share/systemroms"
