name: Export openMSX runtime for local private-ROM testing
on:
  workflow_dispatch:
  push:
    branches: [feature/z80-renderer]
    paths: ['.github/workflows/openmsx-runtime.yml']

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install openMSX system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openmsx openmsx-data
          dpkg -L openmsx-data | grep -m 10 '/usr/share/openmsx/' || true
          ldd /usr/bin/openmsx
      - name: Package public openMSX executable and machine descriptions
        run: |
          mkdir -p package/usr/bin package/usr/share package/usr/lib
          cp /usr/bin/openmsx package/usr/bin/
          cp -L /usr/lib/x86_64-linux-gnu/libSDL2_ttf-2.0.so.0 package/usr/lib/
          cp -a /usr/share/openmsx package/usr/share/
          tar -czf openmsx-runtime.tar.gz -C package usr
          tar -tzf openmsx-runtime.tar.gz | head -15
      - name: Export executable only (no copyrighted BIOS)
        uses: actions/upload-artifact@v4
        with:
          name: openmsx-linux-runtime-no-roms
          path: openmsx-runtime.tar.gz
          if-no-files-found: error
